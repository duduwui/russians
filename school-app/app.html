<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORASIA — School Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
/* ==========================================================================
   ORASIA School Manager — design system
   Navy + garnet academic palette pulled from the ORASIA crest.
   Every selector name below matches the JS exactly — only visual
   treatment changed, no structural/behavioural classes were touched.
   ========================================================================== */

/* ============ Design tokens ============ */
:root {
  --bg:            #f3f4f7;
  --panel:         #ffffff;
  --panel-2:       #f7f8fb;
  --border:        #e6e8ee;
  --border-strong: #d3d7e0;
  --text:          #17212e;
  --text-soft:     #52606f;
  --text-mute:     #8993a4;

  /* Brand: navy + garnet, lifted from the ORASIA mark */
  --primary:       #1c3454;
  --primary-600:   #14283f;
  --primary-soft:  #e8edf5;

  --accent:        #8a2432;
  --accent-600:    #6f1c28;
  --accent-soft:   #fbeaec;

  --success:       #1a8a5f;
  --success-soft:  #e5f7ef;
  --warning:       #b0781a;
  --warning-soft:  #fbf1de;
  --danger:        #b3261e;
  --danger-soft:   #fbeae8;
  --info:          #285e93;
  --info-soft:     #e8f0f9;

  --shadow-sm:  0 1px 2px rgba(20, 30, 45, .06);
  --shadow-md:  0 6px 16px rgba(20, 30, 45, .09);
  --shadow-lg:  0 20px 44px rgba(15, 22, 35, .16);

  --radius:     12px;
  --radius-sm:  8px;
  --radius-lg:  18px;
  --sidebar-w:  248px;
  --topbar-h:   62px;

  --font-display: "Plus Jakarta Sans", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body:    "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-ar:      "Cairo", Tahoma, sans-serif;
}

[data-theme="dark"] {
  --bg:            #0c1420;
  --panel:         #121b29;
  --panel-2:       #182337;
  --border:        #253248;
  --border-strong: #34435e;
  --text:          #e8ecf3;
  --text-soft:     #a7b1c2;
  --text-mute:     #6c7890;

  --primary:       #4d7bb5;
  --primary-600:   #6f96c6;
  --primary-soft:  #1c2c44;

  --accent:        #d97785;
  --accent-600:    #e39aa4;
  --accent-soft:   #34212a;

  --success-soft:  #123527;
  --warning-soft:  #352a12;
  --danger-soft:   #3a1c1a;
  --info-soft:     #112a3f;

  --shadow-sm:  0 1px 2px rgba(0,0,0,.35);
  --shadow-md:  0 6px 18px rgba(0,0,0,.4);
  --shadow-lg:  0 20px 48px rgba(0,0,0,.55);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }

body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  line-height: 1.5;
}
[dir="rtl"] body { font-family: var(--font-ar), var(--font-body); }

button, input, select, textarea { font-family: inherit; font-size: 14px; }
button { cursor: pointer; }
a { color: var(--primary); text-decoration: none; }
[data-theme="dark"] a { color: var(--primary-600); }

h1, h2, h3, .page-title, .brand-name, .stat .val, .modal-head h3, .card-head h3 {
  font-family: var(--font-display);
}
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3,
[dir="rtl"] .page-title, [dir="rtl"] .brand-name, [dir="rtl"] .stat .val,
[dir="rtl"] .modal-head h3, [dir="rtl"] .card-head h3 { font-family: var(--font-ar); }

/* ============ Icons ============ */
.icon {
  width: 18px; height: 18px;
  stroke: currentColor; fill: none;
  stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  flex-shrink: 0; vertical-align: middle;
}
.icon.sm { width: 14px; height: 14px; }
.icon.lg { width: 28px; height: 28px; stroke-width: 1.5; }

/* ============ Layout ============ */
#app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr;
  min-height: 100vh;
}
[dir="rtl"] #app { grid-template-columns: 1fr var(--sidebar-w); }

/* Signature element: deep navy sidebar, gives the whole app an
   institutional identity instead of a generic white admin shell. */
.sidebar {
  background: linear-gradient(185deg, var(--primary-600) 0%, #101c2d 100%);
  border-left: 0;
  display: flex; flex-direction: column;
  position: sticky; top: 0;
  height: 100vh; overflow-y: auto;
  order: 1;
  box-shadow: var(--shadow-lg);
}
[data-theme="dark"] .sidebar { background: linear-gradient(185deg, #101a29 0%, #0a121d 100%); }
[dir="rtl"] .sidebar { border-left: 0; border-right: 0; order: 2; }

.main { order: 2; }
[dir="rtl"] .main { order: 1; }

.brand {
  display: flex; align-items: center; gap: 12px;
  padding: 22px 20px 18px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.brand-logo {
  width: 42px; height: 42px; border-radius: 11px;
  background: linear-gradient(135deg, var(--accent), var(--accent-600));
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 18px; font-family: var(--font-display);
  box-shadow: 0 4px 12px rgba(138, 36, 50, .45);
  overflow: hidden; flex-shrink: 0;
}
.brand-logo img { width: 100%; height: 100%; object-fit: cover; }
.brand-name { font-weight: 700; font-size: 15px; color: #fff; line-height: 1.2; letter-spacing: -.01em; }
.brand-sub  { font-size: 11px; color: rgba(255,255,255,.5); margin-top: 3px; }

.nav { flex: 1; padding: 16px 12px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 13px;
  border-radius: var(--radius-sm);
  color: rgba(255,255,255,.62);
  font-size: 13.5px; font-weight: 500;
  margin-bottom: 3px;
  border-inline-start: 3px solid transparent;
  transition: background .14s ease, color .14s ease, border-color .14s ease;
  cursor: pointer;
}
.nav-item:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav-item.active {
  background: rgba(255,255,255,.1);
  color: #fff; font-weight: 600;
  border-inline-start-color: var(--accent);
}
.nav-item .ic { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }

.sidebar-footer {
  padding: 14px 20px;
  border-top: 1px solid rgba(255,255,255,.08);
  color: rgba(255,255,255,.4); font-size: 11px;
}

.main { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  height: var(--topbar-h);
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 26px;
  position: sticky; top: 0; z-index: 10;
}
.topbar-left  { display: flex; align-items: center; gap: 14px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.crumb { color: var(--text-soft); font-size: 13.5px; }
.crumb .sep { margin: 0 6px; color: var(--text-mute); }
.crumb #crumbPage { color: var(--text); font-weight: 600; }

.icon-btn, .ghost-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-soft);
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  display: inline-flex; align-items: center; justify-content: center;
  transition: background .12s, border-color .12s, color .12s;
}
.icon-btn:hover, .ghost-btn:hover {
  background: var(--panel-2); color: var(--primary); border-color: var(--border);
}

.search-mini input {
  background: var(--panel-2); border: 1px solid var(--border);
  padding: 8px 14px 8px 34px; border-radius: 999px; min-width: 260px;
  color: var(--text);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238993a4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>");
  background-repeat: no-repeat; background-position: 12px center;
  transition: border-color .12s, background-color .12s, box-shadow .12s;
}
[dir="rtl"] .search-mini input { padding: 8px 34px 8px 14px; background-position: right 12px center; }
.search-mini input:focus { outline: none; border-color: var(--primary); background-color: var(--panel); box-shadow: 0 0 0 3px var(--primary-soft); }

.lang-switch {
  display: flex; background: var(--panel-2);
  border: 1px solid var(--border); border-radius: 999px; overflow: hidden;
  padding: 2px;
}
.lang-switch button {
  background: transparent; border: 0; color: var(--text-soft);
  padding: 6px 12px; font-size: 12.5px; font-weight: 700;
  border-radius: 999px;
  transition: background .14s, color .14s;
}
.lang-switch button.active { background: var(--primary); color: white; }

.content { padding: 28px 32px; max-width: 1400px; margin: 0 auto; width: 100%; }

/* ============ Page header ============ */
.page-head {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-bottom: 22px; flex-wrap: wrap; gap: 12px;
}
.page-title { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.02em; color: var(--text); }
.page-sub   { color: var(--text-mute); font-size: 13px; margin-top: 5px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 9px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--panel);
  color: var(--text);
  font-weight: 600; font-size: 13.5px;
  transition: background .12s, border-color .12s, transform .05s, box-shadow .12s;
  white-space: nowrap;
}
.btn:hover  { background: var(--panel-2); box-shadow: var(--shadow-sm); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-600); border-color: var(--primary-600); box-shadow: 0 4px 12px rgba(28,52,84,.28); }
.btn.danger  { background: var(--danger);  color: #fff; border-color: var(--danger); }
.btn.danger:hover  { background: #921e18; border-color: #921e18; }
.btn.success { background: var(--success); color: #fff; border-color: var(--success); }
.btn.ghost   { border-color: transparent; background: transparent; color: var(--text-soft); }
.btn.ghost:hover { background: var(--panel-2); color: var(--text); }
.btn.sm { padding: 6px 12px; font-size: 12.5px; }
.btn.sm .icon { width: 13px; height: 13px; }
.btn .icon { width: 15px; height: 15px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ============ Cards ============ */
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}
.card-head {
  padding: 16px 20px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  gap: 12px;
}
.card-head h3 { margin: 0; font-size: 15.5px; font-weight: 700; letter-spacing: -.01em; }
.card-body { padding: 20px; }

/* ============ Stat cards ============ */
.stat-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.stat {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  box-shadow: var(--shadow-sm);
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px;
  position: relative;
  overflow: hidden;
  transition: box-shadow .16s, transform .16s;
}
.stat::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 0; bottom: 0;
  width: 3px; background: var(--primary);
}
.stat:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.stat .lbl {
  color: var(--text-mute); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .06em;
}
.stat .val { font-size: 25px; font-weight: 800; margin-top: 7px; color: var(--text); letter-spacing: -0.02em; }
.stat .sub { color: var(--text-mute); font-size: 11.5px; margin-top: 5px; }
.stat-ic {
  width: 40px; height: 40px; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  background: var(--primary-soft); color: var(--primary);
  flex-shrink: 0;
}
.stat.success::before { background: var(--success); }
.stat.warning::before { background: var(--warning); }
.stat.danger::before  { background: var(--danger); }
.stat.info::before    { background: var(--info); }
.stat.success .stat-ic { background: var(--success-soft); color: var(--success); }
.stat.warning .stat-ic { background: var(--warning-soft); color: var(--warning); }
.stat.danger  .stat-ic { background: var(--danger-soft);  color: var(--danger); }
.stat.info    .stat-ic { background: var(--info-soft);    color: var(--info); }

/* ============ Toolbar ============ */
.toolbar {
  display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
  align-items: center;
}
.toolbar input, .toolbar select {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 13px; color: var(--text);
  transition: border-color .12s, box-shadow .12s;
}
.toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.toolbar .search { flex: 1; min-width: 240px; }

/* ============ Tables ============ */
.table-wrap {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow-x: auto;
  box-shadow: var(--shadow-sm);
}
table.data { width: 100%; border-collapse: collapse; }
table.data th, table.data td {
  padding: 13px 16px; text-align: start;
  border-bottom: 1px solid var(--border);
  font-size: 13.5px;
}
table.data th {
  background: var(--panel-2);
  color: var(--text-soft);
  font-weight: 700;
  font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
}
table.data td.num, table.data th.num { text-align: end; font-variant-numeric: tabular-nums; }
table.data tbody tr { transition: background .1s; }
table.data tbody tr:hover { background: var(--panel-2); }
table.data tbody tr:last-child td { border-bottom: 0; }

.tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px 3px 8px; border-radius: 999px;
  font-size: 11.5px; font-weight: 700;
  background: var(--primary-soft); color: var(--primary);
}
.tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
.tag.success { background: var(--success-soft); color: var(--success); }
.tag.warning { background: var(--warning-soft); color: var(--warning); }
.tag.danger  { background: var(--danger-soft);  color: var(--danger); }
.tag.muted   { background: var(--panel-2); color: var(--text-mute); border: 1px solid var(--border); }
.tag.muted::before { display: none; }

/* ============ Empty states ============ */
.empty {
  text-align: center; padding: 54px 24px;
  color: var(--text-mute);
}
.empty .em {
  display: inline-flex; align-items: center; justify-content: center;
  width: 60px; height: 60px; border-radius: 50%;
  background: var(--primary-soft); color: var(--primary);
  margin-bottom: 14px;
}
.empty-text { font-size: 14.5px; color: var(--text-soft); margin-bottom: 4px; font-weight: 500; }
.empty-cta  { font-size: 13px; margin-top: 14px; }

/* ============ Forms ============ */
.form-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}
.form-grid .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12.5px; font-weight: 700; color: var(--text-soft); }
.field .req  { color: var(--accent); }
.field input, .field select, .field textarea {
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  padding: 10px 13px;
  color: var(--text);
  width: 100%;
  transition: border-color .12s, box-shadow .12s;
}
.field textarea { min-height: 80px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.field .hint { font-size: 11.5px; color: var(--text-mute); }
.checklist {
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  max-height: 260px; overflow-y: auto;
  background: var(--panel);
}
.checklist label {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px;
  border-bottom: 1px solid var(--border);
  font-weight: 500; color: var(--text);
  cursor: pointer;
  transition: background .1s;
}
.checklist label:last-child { border-bottom: 0; }
.checklist label:hover { background: var(--panel-2); }
.checklist input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--primary); }
.checklist .meta { color: var(--text-mute); font-size: 12px; margin-inline-start: auto; }

/* ============ Modal ============ */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(12, 18, 28, .6);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 20px;
  animation: fadeIn .15s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--panel);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 620px;
  max-height: 90vh; display: flex; flex-direction: column;
  animation: pop .18s;
  overflow: hidden;
}
@keyframes pop { from { transform: scale(.96) translateY(6px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
.modal.wide { max-width: 880px; }
.modal-head {
  padding: 18px 22px; border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  background: var(--panel-2);
}
.modal-head h3 { margin: 0; font-size: 16.5px; font-weight: 700; letter-spacing: -.01em; }
.modal-body { padding: 22px; overflow-y: auto; }
.modal-foot {
  padding: 15px 22px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

/* ============ Toast ============ */
.toast {
  position: fixed; bottom: 24px; inset-inline-end: 24px;
  background: var(--primary-600); color: #fff;
  padding: 13px 20px; border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  z-index: 200; font-size: 13.5px; font-weight: 600;
  animation: slideIn .2s;
}
@keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.toast.success { background: var(--success); color: #fff; }
.toast.error   { background: var(--danger);  color: #fff; }

/* ============ Split ============ */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.split-2fr-1fr { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
@media (max-width: 900px) {
  .split, .split-2fr-1fr { grid-template-columns: 1fr; }
}

/* ============ Sales quick-add bar ============ */
.quickbar-wrap {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 16px;
}
.quickbar-title {
  font-size: 11.5px; font-weight: 700; color: var(--text-mute);
  text-transform: uppercase; letter-spacing: .05em;
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 6px;
}
.quickbar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  align-items: end;
}
.quickbar .qb-field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.quickbar .qb-book { grid-column: span 2; }
.quickbar .qb-add  { grid-column: span 1; }
.quickbar .qb-qty  { grid-column: span 1; }
.quickbar label {
  font-size: 11.5px; font-weight: 700; color: var(--text-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.quickbar input, .quickbar select {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px; color: var(--text);
  width: 100%;
  min-width: 0;
  transition: border-color .12s, box-shadow .12s, background .12s;
}
.quickbar input:focus, .quickbar select:focus {
  outline: none; border-color: var(--primary);
  background: var(--panel);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.quickbar select:disabled { opacity: .55; cursor: not-allowed; }
.quickbar .add-btn { padding: 10px 18px; height: 40px; width: 100%; }
.quickbar-wrap .kbd-hint { color: var(--text-mute); font-size: 11px; margin-top: 9px; }

@media (max-width: 1200px) {
  .quickbar { grid-template-columns: repeat(3, 1fr); }
  .quickbar .qb-book { grid-column: span 3; }
  .quickbar .qb-add  { grid-column: span 3; }
}
@media (max-width: 700px) {
  .quickbar { grid-template-columns: 1fr 1fr; }
  .quickbar .qb-book { grid-column: 1 / -1; }
  .quickbar .qb-add  { grid-column: 1 / -1; }
}

/* ============ Custom fields (student form) ============ */
.custom-fields { display: flex; flex-direction: column; gap: 6px; }
.custom-fields .row {
  display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: center;
}
.custom-fields .row input {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 9px 11px; color: var(--text);
}
.custom-fields .row input:focus {
  outline: none; border-color: var(--primary);
  background: var(--panel);
}
.custom-fields .empty-line {
  color: var(--text-mute); font-size: 12.5px; padding: 4px 0;
}

/* Session summary bar */
.session-bar {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px;
  background: linear-gradient(120deg, var(--primary-soft), transparent 80%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
}
.session-info { display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
.session-info .item { display: flex; flex-direction: column; }
.session-info .lbl { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
.session-info .val { font-size: 19px; font-weight: 800; color: var(--text); font-family: var(--font-display); }
.session-info .val.big { font-size: 23px; color: var(--accent); }

/* ============ Charts (SVG-based) ============ */
.chart-bars {
  display: flex; align-items: flex-end; gap: 5px;
  height: 180px; padding: 12px 0;
}
.chart-bars .bar {
  flex: 1;
  background: linear-gradient(180deg, var(--primary), var(--primary-600));
  border-radius: 5px 5px 0 0;
  min-height: 2px;
  position: relative;
  transition: opacity .12s, background .12s;
}
.chart-bars .bar:hover { opacity: .85; background: linear-gradient(180deg, var(--accent), var(--accent-600)); }
.chart-bars .bar .lbl {
  position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
  font-size: 11px; color: var(--text); font-weight: 700;
  white-space: nowrap;
  opacity: 0; transition: opacity .12s;
}
.chart-bars .bar:hover .lbl { opacity: 1; }
.chart-axis {
  display: flex; gap: 4px; margin-top: 8px;
  color: var(--text-mute); font-size: 10.5px;
}
.chart-axis > * {
  flex: 1; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.rank-list { display: flex; flex-direction: column; gap: 12px; }
.rank-item {
  display: grid; grid-template-columns: 26px 1fr auto; gap: 12px;
  align-items: center;
}
.rank-item .rank {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--panel-2); color: var(--text-soft);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 12px;
}
.rank-item:nth-child(1) .rank { background: var(--warning-soft); color: var(--warning); }
.rank-item:nth-child(2) .rank { background: var(--panel-2); color: var(--text-soft); }
.rank-item:nth-child(3) .rank { background: var(--accent-soft); color: var(--accent); }
.rank-item .name { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-item .meta { color: var(--text-mute); font-size: 12px; }
.rank-item .val  { font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; }
.rank-bar {
  grid-column: 2; height: 6px; border-radius: 3px;
  background: var(--panel-2); overflow: hidden; margin-top: 6px;
}
.rank-bar > div {
  height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 3px;
}

/* ============ Delta indicators (period-over-period) ============ */
.stat .delta {
  display: inline-flex; align-items: center; gap: 3px;
  font-weight: 700;
}
.stat .delta.up   { color: var(--success); }
.stat .delta.down { color: var(--danger); }
.stat .delta.flat { color: var(--text-mute); }
.stat .delta .icon { width: 12px; height: 12px; }

/* ============ Insights grid ============ */
.insight-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px;
}
.insight-item {
  padding: 18px 20px;
  border-radius: var(--radius);
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-inline-start: 3px solid var(--primary);
}
.insight-item.bestDay     { border-inline-start-color: var(--success); }
.insight-item.bestBook    { border-inline-start-color: var(--warning); }
.insight-item.bestTeacher { border-inline-start-color: var(--accent); }
.insight-title {
  font-size: 11px; font-weight: 700; letter-spacing: .05em;
  text-transform: uppercase; color: var(--text-mute);
  margin-bottom: 7px;
}
.insight-big {
  font-size: 17.5px; font-weight: 700; color: var(--text);
  line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-display);
}
[dir="rtl"] .insight-big { font-family: var(--font-ar); }
.insight-sub {
  font-size: 12.5px; color: var(--text-soft);
  margin-top: 4px;
}

/* ============ Log filters ============ */
.log-filters {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
}
.log-filters input, .log-filters select {
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 13px; color: var(--text);
}
.log-filters .search { flex: 1; min-width: 220px; }
.log-filters input:focus, .log-filters select:focus {
  outline: none; border-color: var(--primary);
  background: var(--panel);
}

/* ============ Settings pieces ============ */
.settings-section { margin-bottom: 24px; }
.lookup-list {
  display: flex; flex-direction: column; gap: 8px;
}
.lookup-row {
  display: grid; grid-template-columns: 1fr 100px 100px auto;
  gap: 8px; align-items: center;
  padding: 11px 13px;
  background: var(--panel-2);
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  transition: border-color .12s;
}
.lookup-row:hover { border-color: var(--border-strong); }
.lookup-row input {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 11px; color: var(--text);
}
.lookup-row input:focus { outline: none; border-color: var(--primary); }
.lookup-row.simple { grid-template-columns: 1fr auto; }
.lookup-row.class-row { grid-template-columns: 1fr 160px auto; }
.lookup-row select {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 11px; color: var(--text);
}
.lookup-row select:focus { outline: none; border-color: var(--primary); }

/* ============ Responsive ============ */
@media (max-width: 640px) {
  #app { grid-template-columns: 1fr; }
  [dir="rtl"] #app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: 0; inset-inline-end: 0;
    z-index: 50; width: var(--sidebar-w);
    box-shadow: var(--shadow-lg);
    transform: translateX(100%);
    transition: transform .2s;
  }
  [dir="rtl"] .sidebar { transform: translateX(-100%); }
  body.sidebar-open .sidebar { transform: translateX(0); }
  .search-mini input { min-width: 140px; }
  .content { padding: 18px; }
  .form-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) and (min-width: 641px) {
  :root { --sidebar-w: 208px; }
}

/* ============ Print ============ */
@media print {
  .sidebar, .topbar, .page-actions, .toolbar { display: none !important; }
  .content { padding: 0; max-width: 100%; }
  .card, .table-wrap { border: 0; box-shadow: none; }
  body { background: #fff; }
  .stat { break-inside: avoid; }
}

/* ============ How-to guide ============ */
.howto-step {
  display: grid; grid-template-columns: 34px 1fr; gap: 14px;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.howto-step:last-of-type { border-bottom: 0; }
.howto-num {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
}
.howto-title {
  color: var(--text); font-weight: 700; margin-bottom: 4px; font-size: 14px;
}
kbd {
  background: var(--panel-2); border: 1px solid var(--border-strong);
  border-radius: 4px; padding: 1px 6px; font-family: inherit;
  font-size: 11.5px; color: var(--text);
}

/* ============ Chip filter bar ============ */
.filter-bar {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  margin-bottom: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 14px 24px;
  align-items: center;
}
.filter-group {
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
}
.filter-label {
  font-size: 11px; font-weight: 700; letter-spacing: .06em;
  text-transform: uppercase; color: var(--text-mute);
}
.chip-row { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  padding: 6px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text-soft);
  font-size: 13px; font-weight: 600;
  transition: background .12s, color .12s, border-color .12s;
  min-width: 32px;
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 2px 6px rgba(28, 52, 84, 0.3);
}
.filter-select {
  padding: 8px 32px 8px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel-2);
  color: var(--text);
  font-size: 13px; font-weight: 600;
  min-width: 160px;
  cursor: pointer;
}
.filter-select:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.filter-summary {
  margin-inline-start: auto;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px;
  background: var(--success-soft);
  border: 1px solid var(--success);
  border-radius: 999px;
  color: var(--success);
  font-size: 12.5px; font-weight: 700;
}
[data-theme="dark"] .filter-summary { color: #6ee7b7; }

/* ============ Schedule grid ============ */
.sched-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.sched-col { background: var(--panel); display: flex; flex-direction: column; }
.sched-day-head {
  background: var(--panel-2);
  padding: 15px 16px;
  font-weight: 700;
  font-size: 13.5px;
  text-align: center;
  color: var(--text);
  border-bottom: 1px solid var(--border);
  font-family: var(--font-display);
}
[dir="rtl"] .sched-day-head { font-family: var(--font-ar); }
.sched-day-body {
  padding: 10px;
  display: flex; flex-direction: column; gap: 8px;
  min-height: 180px;
  flex: 1;
}
.sched-entry {
  background: var(--primary-soft);
  border: 1px solid transparent;
  border-inline-start: 3px solid var(--primary);
  border-radius: 8px;
  padding: 10px 12px;
  cursor: pointer;
  transition: transform .1s, box-shadow .12s, background .12s;
}
.sched-entry:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--primary); }
.sched-entry.practical { background: color-mix(in srgb, var(--info-soft) 90%, transparent); border-inline-start-color: var(--info); }
.sched-entry.break { background: var(--panel-2); border-inline-start-color: var(--text-mute); }
.sched-entry-head {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 8px; margin-bottom: 4px;
}
.sched-title {
  font-weight: 700; font-size: 13px; color: var(--text);
  line-height: 1.3;
}
.sched-badge {
  font-size: 9.5px; font-weight: 700; letter-spacing: .05em;
  padding: 2px 6px; border-radius: 3px;
  background: rgba(255,255,255,0.55);
  color: var(--text-soft);
  flex-shrink: 0;
}
[data-theme="dark"] .sched-badge { background: rgba(0,0,0,.3); }
.sched-entry-meta {
  font-size: 11.5px; color: var(--text-soft);
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.sched-entry-meta .icon { width: 12px; height: 12px; }
.sched-time {
  padding: 1px 5px;
  background: rgba(0,0,0,.05);
  border-radius: 3px;
  font-variant-numeric: tabular-nums;
}
[data-theme="dark"] .sched-time { background: rgba(255,255,255,.05); }
.sched-entry-room {
  font-size: 11px; color: var(--text-mute);
  margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}
.sched-entry-room .icon { width: 11px; height: 11px; }
.sched-add {
  display: flex; align-items: center; justify-content: center;
  padding: 12px;
  background: transparent;
  border: 1.5px dashed var(--border-strong);
  border-radius: 8px;
  color: var(--text-mute);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
}
.sched-add:hover { background: var(--primary-soft); color: var(--primary); border-color: var(--primary); border-style: solid; }
.sched-add .icon { width: 18px; height: 18px; }

/* ============ Type toggle (schedule form) ============ */
.type-toggle {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  padding: 4px;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.type-btn {
  padding: 8px 10px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
  color: var(--text-soft);
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: background .12s, color .12s, border-color .12s;
}
.type-btn:hover { color: var(--text); }
.type-btn.active {
  background: var(--panel);
  color: var(--primary);
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}

/* ============ Responsive schedule ============ */
@media (max-width: 1100px) {
  .sched-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .sched-grid { grid-template-columns: 1fr 1fr; }
  .filter-summary { margin-inline-start: 0; }
}

/* ============ Focus rings ============ */
button:focus-visible, a:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}

</style>
