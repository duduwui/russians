function _safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function _safeSet(k,v){ try { localStorage.setItem(k,v); } catch (e) {} }

const i18n = {
  lang: _safeGet("app.lang") || "en",
  t(key) { return (I18N[this.lang] && I18N[this.lang][key]) || I18N.en[key] || key; },
  setLang(lang) {
    this.lang = lang;
    _safeSet("app.lang", lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    this.apply();
    if (window.App && window.App.rerender) window.App.rerender();
  },
  apply() {
    document.querySelectorAll("[data-i18n]").forEach(el => {
      el.textContent = this.t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(el => {
      el.setAttribute("placeholder", this.t(el.getAttribute("data-i18n-ph")));
    });
    document.querySelectorAll(".lang-switch button").forEach(b => {
      b.classList.toggle("active", b.dataset.lang === this.lang);
    });
  }
};


// ===== js/db.js =====
// LocalStorage-backed DB with in-memory fallback for sandboxed environments.
//
// Data model (simplified):
//   settings   { orgName, logo, theme, lang, currency }
//   shifts     [{ id, name, nameAr, start, end }]        // used by subjects (lookup, in Settings)
//   bookTypes  [{ id, name }]                            // e.g. "Full Course", "First Half" (lookup)
//   teachers   [{ id, name, phone, notes }]
//   subjects   [{ id, name, teacherId, shiftId, price, notes, studentIds:[] }]
//   students   [{ id, fullName, phone, gender, dob, guardian, address, notes, subjectIds:[], enrolled }]
//   sales      [{ id, ts, session, book, teacherId, typeId, qty, price, total, notes }]
//   session    { current: "YYYY-MM-DD", startedAt }     // "day" bucket for the sales tab

const DB = {
  KEY: "school.db.v2",
  data: null,
  _mem: null,
  _storageOk: null,

  storageAvailable() {
    if (this._storageOk !== null) return this._storageOk;
    try {
      localStorage.setItem("__p__", "1");
      localStorage.removeItem("__p__");
      this._storageOk = true;
    } catch (e) {
      this._storageOk = false;
      console.warn("localStorage unavailable — using in-memory store");
    }
    return this._storageOk;
  },
  _read()  { return this.storageAvailable() ? localStorage.getItem(this.KEY) : this._mem; },
  _write(v){ if (this.storageAvailable()) localStorage.setItem(this.KEY, v); else this._mem = v; },

  defaults() {
    return {
      settings: {
        orgName: "",
        logo: null,
        theme: "light",
        lang: "en",
        currency: "IQD"
      },
      shifts:    [],
      grades:    [],
      classes:   [],   // { id, name, gradeId }
      bookTypes: [
        { id: "type_full",  name: "Full Course" },
        { id: "type_first", name: "First Half"  },
        { id: "type_second",name: "Second Half" }
      ],
      teachers:  [],
      subjects:  [],   // may have gradeId (optional target grade)
      students:  [],   // gradeId + classId
      sales:     [],
      schedule:  [],   // { id, gradeId, classId, shiftId, day, startTime, endTime, subjectId, teacherId, room, type, notes }
      session:   { current: null, startedAt: null }
    };
  },

  load() {
    try {
      const raw = this._read();
      if (raw) {
        this.data = JSON.parse(raw);
        const d = this.defaults();
        for (const k of Object.keys(d)) {
          if (!(k in this.data)) this.data[k] = d[k];
        }
        this.data.settings = { ...d.settings, ...(this.data.settings || {}) };
        // Migration: subject.teacherId (single) → subject.teacherIds (array)
        this.list("subjects").forEach(sub => {
          if (!Array.isArray(sub.teacherIds)) {
            sub.teacherIds = sub.teacherId ? [sub.teacherId] : [];
          }
        });
      } else {
        this.data = this.defaults();
        this.save();
      }
    } catch (e) {
      console.error("DB load", e);
      this.data = this.defaults();
    }
  },

  save() {
    try {
      this._write(JSON.stringify(this.data));
    } catch (e) {
      console.error("DB save", e);
      this._storageOk = false;
      this._mem = JSON.stringify(this.data);
      if (typeof UI !== "undefined") {
        UI.toast("Storage unavailable — changes won't persist", "error");
      }
    }
  },

  reset() {
    this.data = this.defaults();
    this.save();
  },

  // Small demo dataset (3 teachers, 3 subjects, 5 students, 4 sales)
  loadSample() {
    // Shifts
    const morning = this.upsert("shifts", { name: "Morning", start: "08:00", end: "12:00" });
    const evening = this.upsert("shifts", { name: "Evening", start: "16:00", end: "20:00" });

    // Grades + Classes
    const g11 = this.upsert("grades", { name: "Grade 11" });
    const g12 = this.upsert("grades", { name: "Grade 12" });
    const c11a = this.upsert("classes", { name: "11-A", gradeId: g11.id });
    const c12a = this.upsert("classes", { name: "12-A", gradeId: g12.id });
    const c12b = this.upsert("classes", { name: "12-B", gradeId: g12.id });

    // Teachers
    const t1 = this.upsert("teachers", { name: "Ahmed Hassan",  phone: "0770-100-0001", notes: "Math & Physics" });
    const t2 = this.upsert("teachers", { name: "Sara Mahmoud",  phone: "0770-100-0002", notes: "English" });
    const t3 = this.upsert("teachers", { name: "Omar Ali",      phone: "0770-100-0003", notes: "Chemistry" });

    // Subjects (with target grade & possibly multiple teachers)
    const s1 = this.upsert("subjects", { name: "Math — Grade 12", teacherIds: [t1.id], shiftId: morning.id, gradeId: g12.id, price: 50000, notes: "Preparation for final exam" });
    const s2 = this.upsert("subjects", { name: "English Intensive", teacherIds: [t2.id], shiftId: evening.id, gradeId: "", price: 40000, notes: "" });
    const s3 = this.upsert("subjects", { name: "Chemistry — Grade 12", teacherIds: [t3.id, t1.id], shiftId: morning.id, gradeId: g12.id, price: 45000, notes: "Also taught by Ahmed for extra sections" });

    // Students — with grade & class
    const st1 = this.upsert("students", { fullName: "Layla Ibrahim", phone: "0750-111-0001", gender: "female", gradeId: g12.id, classId: c12a.id, enrolled: this.today(), custom: [{ label: "Guardian", value: "Ibrahim Karim" }] });
    const st2 = this.upsert("students", { fullName: "Yousif Karim",  phone: "0750-111-0002", gender: "male",   gradeId: g12.id, classId: c12a.id, enrolled: this.today() });
    const st3 = this.upsert("students", { fullName: "Noor Salim",    phone: "0750-111-0003", gender: "female", gradeId: g11.id, classId: c11a.id, enrolled: this.today() });
    const st4 = this.upsert("students", { fullName: "Hassan Ali",    phone: "0750-111-0004", gender: "male",   gradeId: g12.id, classId: c12b.id, enrolled: this.today() });
    const st5 = this.upsert("students", { fullName: "Fatima Zaki",   phone: "0750-111-0005", gender: "female", gradeId: g11.id, classId: c11a.id, enrolled: this.today() });

    // Enrollments (M2M)
    this.setStudentSubjects(st1.id, [s1.id, s3.id]);
    this.setStudentSubjects(st2.id, [s1.id]);
    this.setStudentSubjects(st3.id, [s2.id]);
    this.setStudentSubjects(st4.id, [s1.id, s2.id]);
    this.setStudentSubjects(st5.id, [s3.id, s2.id]);

    // A few sample sales for today's session
    this.addSale({ book: "Math — Full Course", teacherId: t1.id, typeId: "type_full",   qty: 2, price: 15000 });
    this.addSale({ book: "Physics Part 1",     teacherId: t1.id, typeId: "type_first",  qty: 1, price: 8000  });
    this.addSale({ book: "English Grammar",    teacherId: t2.id, typeId: "type_full",   qty: 3, price: 12000 });
    this.addSale({ book: "Chemistry Workbook", teacherId: t3.id, typeId: "type_second", qty: 1, price: 10000 });

    // Sample schedule for Grade 12 / 12-A / Morning
    this.upsert("schedule", { gradeId: g12.id, classId: c12a.id, shiftId: morning.id, day: "Sun", startTime: "08:30", endTime: "10:00", subjectId: s1.id, teacherId: t1.id, room: "Room 101" });
    this.upsert("schedule", { gradeId: g12.id, classId: c12a.id, shiftId: morning.id, day: "Sun", startTime: "10:15", endTime: "11:45", subjectId: s3.id, teacherId: t3.id, room: "Room 203" });
    this.upsert("schedule", { gradeId: g12.id, classId: c12a.id, shiftId: morning.id, day: "Mon", startTime: "08:30", endTime: "10:00", subjectId: s1.id, teacherId: t1.id, room: "Room 101" });
    this.upsert("schedule", { gradeId: g12.id, classId: c12a.id, shiftId: morning.id, day: "Wed", startTime: "10:15", endTime: "11:45", subjectId: s3.id, teacherId: t1.id, room: "Room 203" });
    this.upsert("schedule", { gradeId: g11.id, classId: c11a.id, shiftId: morning.id, day: "Tue", startTime: "08:30", endTime: "10:00", subjectId: s2.id, teacherId: t2.id, room: "Room 105" });

    this.save();
  },

  today() { return new Date().toISOString().slice(0, 10); },
  now()   { return new Date().toISOString(); },

  newId(prefix = "id") {
    return `${prefix}_${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
  },

  // ---------- Generic CRUD ----------
  list(entity) { return this.data[entity] || []; },
  get(entity, id) {
    if (!id) return null;
    return (this.data[entity] || []).find(x => x.id === id) || null;
  },
  upsert(entity, item) {
    const arr = this.data[entity];
    if (!arr) throw new Error("Unknown entity: " + entity);
    if (!item.id) {
      item.id = this.newId(entity.slice(0, 3));
      item.createdAt = this.now();
      arr.push(item);
    } else {
      const idx = arr.findIndex(x => x.id === item.id);
      if (idx >= 0) arr[idx] = { ...arr[idx], ...item, updatedAt: this.now() };
      else { item.createdAt = this.now(); arr.push(item); }
    }
    this.save();
    return item;
  },
  remove(entity, id) {
    this.data[entity] = (this.data[entity] || []).filter(x => x.id !== id);
    // Cascade cleanup
    if (entity === "subjects") {
      this.list("students").forEach(s => {
        if (Array.isArray(s.subjectIds)) s.subjectIds = s.subjectIds.filter(x => x !== id);
      });
    }
    if (entity === "students") {
      this.list("subjects").forEach(sub => {
        if (Array.isArray(sub.studentIds)) sub.studentIds = sub.studentIds.filter(x => x !== id);
      });
    }
    if (entity === "teachers") {
      this.list("subjects").forEach(s => {
        if (Array.isArray(s.teacherIds)) {
          s.teacherIds = s.teacherIds.filter(x => x !== id);
        }
        if (s.teacherId === id) s.teacherId = "";
      });
    }
    if (entity === "shifts") {
      this.list("subjects").forEach(s => { if (s.shiftId === id) s.shiftId = ""; });
    }
    if (entity === "grades") {
      this.list("students").forEach(s => { if (s.gradeId === id) s.gradeId = ""; });
      this.list("subjects").forEach(s => { if (s.gradeId === id) s.gradeId = ""; });
      // Classes belong to a grade — cascade remove those too
      const orphanClasses = this.list("classes").filter(c => c.gradeId === id).map(c => c.id);
      this.data.classes = this.list("classes").filter(c => c.gradeId !== id);
      orphanClasses.forEach(cid => {
        this.list("students").forEach(s => { if (s.classId === cid) s.classId = ""; });
      });
    }
    if (entity === "classes") {
      this.list("students").forEach(s => { if (s.classId === id) s.classId = ""; });
      this.data.schedule = this.list("schedule").filter(e => e.classId !== id);
    }
    if (entity === "subjects") {
      this.data.schedule = this.list("schedule").filter(e => e.subjectId !== id);
    }
    if (entity === "bookTypes") {
      // Sales keep the historical typeName; typeId can dangle
    }
    this.save();
  },

  // Classes filtered by grade (used in student form)
  classesForGrade(gradeId) {
    if (!gradeId) return this.list("classes");
    return this.list("classes").filter(c => c.gradeId === gradeId);
  },

  // Schedule helpers
  scheduleFor({ gradeId, classId, shiftId }) {
    return this.list("schedule").filter(e =>
      (!gradeId || e.gradeId === gradeId) &&
      (!classId || e.classId === classId) &&
      (!shiftId || e.shiftId === shiftId)
    );
  },

  // ---------- Enrollment (M2M student <-> subject) ----------
  enroll(studentId, subjectId) {
    const stu = this.get("students", studentId);
    const sub = this.get("subjects", subjectId);
    if (!stu || !sub) return;
    stu.subjectIds = Array.from(new Set([...(stu.subjectIds || []), subjectId]));
    sub.studentIds = Array.from(new Set([...(sub.studentIds || []), studentId]));
    this.save();
  },
  unenroll(studentId, subjectId) {
    const stu = this.get("students", studentId);
    const sub = this.get("subjects", subjectId);
    if (stu) stu.subjectIds = (stu.subjectIds || []).filter(x => x !== subjectId);
    if (sub) sub.studentIds = (sub.studentIds || []).filter(x => x !== studentId);
    this.save();
  },
  setStudentSubjects(studentId, subjectIds) {
    const stu = this.get("students", studentId);
    if (!stu) return;
    const oldIds = new Set(stu.subjectIds || []);
    const newIds = new Set(subjectIds);
    stu.subjectIds = [...newIds];
    // Sync the reverse side
    this.list("subjects").forEach(sub => {
      const has = (sub.studentIds || []).includes(studentId);
      if (newIds.has(sub.id) && !has) {
        sub.studentIds = [...(sub.studentIds || []), studentId];
      } else if (!newIds.has(sub.id) && has) {
        sub.studentIds = (sub.studentIds || []).filter(x => x !== studentId);
      }
    });
    this.save();
  },
  setSubjectStudents(subjectId, studentIds) {
    const sub = this.get("subjects", subjectId);
    if (!sub) return;
    const newIds = new Set(studentIds);
    sub.studentIds = [...newIds];
    this.list("students").forEach(stu => {
      const has = (stu.subjectIds || []).includes(subjectId);
      if (newIds.has(stu.id) && !has) {
        stu.subjectIds = [...(stu.subjectIds || []), subjectId];
      } else if (!newIds.has(stu.id) && has) {
        stu.subjectIds = (stu.subjectIds || []).filter(x => x !== subjectId);
      }
    });
    this.save();
  },

  // ---------- Sales ----------
  currentSession() {
    if (!this.data.session.current) {
      this.data.session.current = this.today();
      this.data.session.startedAt = this.now();
      this.save();
    }
    return this.data.session;
  },
  startNewDay() {
    this.data.session.current = this.today();
    this.data.session.startedAt = this.now();
    this.save();
  },
  sessionSales() {
    const s = this.currentSession();
    return this.list("sales").filter(x => x.session === s.current);
  },
  addSale(sale) {
    const s = this.currentSession();
    const qty = Math.max(1, parseInt(sale.qty, 10) || 0);
    const price = Math.max(0, parseFloat(sale.price) || 0);
    const rec = {
      id: this.newId("sal"),
      ts: this.now(),
      session: s.current,
      book: (sale.book || "").trim(),
      teacherId: sale.teacherId || "",
      typeId: sale.typeId || "",
      qty,
      price,
      total: +(qty * price).toFixed(2),
      notes: (sale.notes || "").trim()
    };
    if (!rec.book) throw new Error("Book name required");
    this.data.sales.push(rec);
    this.save();
    return rec;
  },
  updateSale(id, patch) {
    const rec = this.get("sales", id);
    if (!rec) return null;
    Object.assign(rec, patch);
    if ("qty" in patch || "price" in patch) {
      rec.qty = Math.max(1, parseInt(rec.qty, 10) || 1);
      rec.price = Math.max(0, parseFloat(rec.price) || 0);
      rec.total = +(rec.qty * rec.price).toFixed(2);
    }
    this.save();
    return rec;
  },
  removeSale(id) {
    this.data.sales = this.list("sales").filter(s => s.id !== id);
    this.save();
  },

  // Autocomplete history for the Sales quick-add
  bookHistory() {
    const map = new Map();
    // most-recent-first
    [...this.list("sales")].reverse().forEach(s => {
      const key = (s.book || "").toLowerCase();
      if (!key || map.has(key)) return;
      map.set(key, {
        book: s.book,
        teacherId: s.teacherId,
        typeId: s.typeId,
        price: s.price
      });
    });
    return [...map.values()];
  },

  // ---------- Backup / Restore ----------
  export() {
    return JSON.stringify({ ...this.data, _v: 2, _at: this.now() }, null, 2);
  },
  import(json) {
    const parsed = JSON.parse(json);
    if (!parsed || typeof parsed !== "object") throw new Error("Invalid file");
    const d = this.defaults();
    for (const k of Object.keys(d)) if (!(k in parsed)) parsed[k] = d[k];
    delete parsed._v; delete parsed._at;
    parsed.settings = { ...d.settings, ...(parsed.settings || {}) };
    this.data = parsed;
    this.save();
  }
};


// ===== js/ui.js =====
const UI = {
  escape(s) {
    return String(s ?? "").replace(/[&<>"']/g, c =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c])
    );
  },

  toast(msg, type = "") {
    const el = document.getElementById("toast");
    if (!el) return;
    el.className = "toast" + (type ? " " + type : "");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.hidden = true; }, 2400);
  },

  modal({ title, bodyHTML, footerHTML = "", onOpen, wide = false }) {
    const back = document.getElementById("modalBackdrop");
    const modal = document.getElementById("modal");
    modal.classList.toggle("wide", !!wide);
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = bodyHTML;
    document.getElementById("modalFoot").innerHTML = footerHTML;
    back.hidden = false;
    if (onOpen) onOpen(modal);
    setTimeout(() => {
      const f = modal.querySelector("input, select, textarea");
      if (f) f.focus();
    }, 40);
  },
  closeModal() {
    const back = document.getElementById("modalBackdrop");
    back.hidden = true;
    document.getElementById("modalBody").innerHTML = "";
    document.getElementById("modalFoot").innerHTML = "";
  },
  confirm(msg, onYes, { okLabel, danger = true } = {}) {
    UI.modal({
      title: i18n.t("common.confirm"),
      bodyHTML: `<p style="margin:0;color:var(--text-soft);line-height:1.5">${UI.escape(msg)}</p>`,
      footerHTML: `
        <button class="btn ghost" data-a="cancel">${i18n.t("common.cancel")}</button>
        <button class="btn ${danger ? "danger" : "primary"}" data-a="ok">${UI.escape(okLabel || i18n.t(danger ? "common.delete" : "common.confirm"))}</button>
      `,
      onOpen(m) {
        m.querySelector('[data-a="cancel"]').onclick = UI.closeModal;
        m.querySelector('[data-a="ok"]').onclick = () => { UI.closeModal(); onYes && onYes(); };
      }
    });
  },

  fmtMoney(n) {
    const c = DB.data.settings.currency || "";
    const num = new Intl.NumberFormat(i18n.lang === "ar" ? "ar-EG" : "en-US").format(+n || 0);
    return c ? `${num} ${c}` : num;
  },
  fmtNumber(n) {
    return new Intl.NumberFormat(i18n.lang === "ar" ? "ar-EG" : "en-US").format(+n || 0);
  },
  fmtDate(d) {
    if (!d) return "—";
    const date = new Date(d);
    if (isNaN(date)) return UI.escape(d);
    return date.toLocaleDateString(i18n.lang === "ar" ? "ar-EG" : "en-GB");
  },
  fmtTime(d) {
    if (!d) return "";
    const date = new Date(d);
    if (isNaN(date)) return "";
    return date.toLocaleTimeString(i18n.lang === "ar" ? "ar-EG" : "en-GB", { hour: "2-digit", minute: "2-digit" });
  },

  // Empty state
  empty(msg, cta = "") {
    return `<div class="empty">
      <div class="em">${icon("inbox", "lg")}</div>
      <div class="empty-text">${UI.escape(msg)}</div>
      ${cta ? `<div class="empty-cta">${cta}</div>` : ""}
    </div>`;
  },

  // Table
  table({ columns, rows, empty }) {
    if (!rows || !rows.length) return empty || UI.empty(i18n.t("common.noResults"));
    const th = columns.map(c => `<th${c.numeric ? ' class="num"' : ""}>${UI.escape(c.label || "")}</th>`).join("");
    const body = rows.map(r => {
      const tds = columns.map(c => {
        let v;
        if (c.render) v = c.render(r);
        else {
          const raw = r[c.key];
          switch (c.type) {
            case "money":  v = UI.fmtMoney(raw); break;
            case "date":   v = UI.fmtDate(raw); break;
            case "number": v = UI.fmtNumber(raw); break;
            default:       v = UI.escape(raw ?? "");
          }
        }
        return `<td${c.numeric ? ' class="num"' : (c.className ? ` class="${c.className}"` : "")}>${v}</td>`;
      }).join("");
      return `<tr data-id="${UI.escape(r.id || "")}">${tds}</tr>`;
    }).join("");
    return `<div class="table-wrap"><table class="data">
      <thead><tr>${th}</tr></thead>
      <tbody>${body}</tbody>
    </table></div>`;
  },

  // Common action buttons for rows
  rowActions(id, { edit = true, del = true } = {}) {
    return `${edit ? `<button class="btn sm" data-edit="${UI.escape(id)}" title="${i18n.t("common.edit")}">${icon("edit","sm")}</button>` : ""}
    ${del ? `<button class="btn sm danger" data-del="${UI.escape(id)}" title="${i18n.t("common.delete")}">${icon("trash","sm")}</button>` : ""}`;
  },

  bindRowActions(entity, onEdit, { confirmLabel } = {}) {
    document.querySelectorAll("[data-edit]").forEach(b => {
      b.onclick = () => onEdit(b.dataset.edit);
    });
    document.querySelectorAll("[data-del]").forEach(b => {
      b.onclick = () => {
        const item = DB.get(entity, b.dataset.del);
        const name = item ? (item.name || item.fullName || item.book || "") : "";
        UI.confirm(
          confirmLabel || `${i18n.t("common.confirmDelete")}${name ? ` — "${name}"` : ""}`,
          () => {
            DB.remove(entity, b.dataset.del);
            UI.toast(i18n.t("common.deleted"), "success");
            App.renderPageOnly();
          }
        );
      };
    });
  },

  // Render a chip row OR a dropdown depending on item count.
  // items: [{ id, name }]
  // Returns HTML with data-* attributes: data-{attrName}="value"
  // If > threshold, uses <select>; else buttons.
  smartFilter({ items, selectedId, attrName, allLabel = "All", threshold = 5 }) {
    if (!items.length) return "";
    if (items.length <= threshold) {
      return `<div class="chip-row">
        <button class="chip ${!selectedId ? "active" : ""}" data-${attrName}="">${UI.escape(allLabel)}</button>
        ${items.map(it => `
          <button class="chip ${selectedId === it.id ? "active" : ""}" data-${attrName}="${UI.escape(it.id)}">${UI.escape(it.name)}</button>
        `).join("")}
      </div>`;
    }
    // Dropdown
    return `<select class="filter-select" data-${attrName}-select>
      <option value="">${UI.escape(allLabel)}</option>
      ${items.map(it => `
        <option value="${UI.escape(it.id)}" ${selectedId === it.id ? "selected" : ""}>${UI.escape(it.name)}</option>
      `).join("")}
    </select>`;
  },

  // <option> list — escapes
  options(entity, selected, { placeholder = null } = {}) {
    const items = DB.list(entity);
    let html = placeholder !== null
      ? `<option value="">${UI.escape(placeholder)}</option>`
      : "";
    items.forEach(it => {
      const name = (i18n.lang === "ar" && it.nameAr) ? it.nameAr : (it.name || it.fullName || "");
      html += `<option value="${UI.escape(it.id)}" ${selected === it.id ? "selected" : ""}>${UI.escape(name)}</option>`;
    });
    return html;
  },

  lookupName(entity, id) {
    const item = DB.get(entity, id);
    if (!item) return "—";
    if (i18n.lang === "ar" && item.nameAr) return item.nameAr;
    return item.name || item.fullName || "—";
  }
};


// ===== js/modules/dashboard.js =====
const Dashboard = {
  render() {
    const students = DB.list("students").length;
    const teachers = DB.list("teachers").length;
    const subjects = DB.list("subjects").length;
    const sales    = DB.list("sales");

    const today = DB.today();
    const monthPrefix = today.slice(0, 7);
    const revToday = sales.filter(s => (s.session || s.ts || "").slice(0, 10) === today)
      .reduce((sum, s) => sum + (+s.total || 0), 0);
    const revMonth = sales.filter(s => (s.session || (s.ts || "").slice(0, 10) || "").startsWith(monthPrefix))
      .reduce((sum, s) => sum + (+s.total || 0), 0);
    const countToday = sales.filter(s => (s.session || s.ts || "").slice(0, 10) === today).length;

    // Recent 5
    const recent = [...sales].sort((a, b) => (b.ts || "").localeCompare(a.ts || "")).slice(0, 5);

    // Top-selling books
    const topMap = {};
    sales.forEach(s => {
      const k = (s.book || "").trim();
      if (!k) return;
      if (!topMap[k]) topMap[k] = { qty: 0, revenue: 0 };
      topMap[k].qty += (+s.qty || 0);
      topMap[k].revenue += (+s.total || 0);
    });
    const top = Object.entries(topMap)
      .sort((a, b) => b[1].qty - a[1].qty)
      .slice(0, 5)
      .map(([book, v]) => ({ book, ...v }));

    const isEmpty = students === 0 && teachers === 0 && subjects === 0 && sales.length === 0;

    return `
      <div class="page-head">
        <div>
          <h1 class="page-title">${i18n.t("dash.title")}</h1>
          <div class="page-sub">${UI.fmtDate(today)}</div>
        </div>
      </div>

      ${isEmpty ? this.renderOnboarding() : `
        <div class="stat-grid">
          ${this.stat({ label: i18n.t("dash.today"),    value: UI.fmtMoney(revToday),
                        sub: `${UI.fmtNumber(countToday)} ${i18n.t("sales.count")}`,
                        iconName: "sales", tone: "success" })}
          ${this.stat({ label: i18n.t("dash.month"),    value: UI.fmtMoney(revMonth),
                        iconName: "trending", tone: "info" })}
          ${this.stat({ label: i18n.t("dash.students"), value: UI.fmtNumber(students), iconName: "user" })}
          ${this.stat({ label: i18n.t("dash.subjects"), value: UI.fmtNumber(subjects), iconName: "subject" })}
          ${this.stat({ label: i18n.t("dash.teachers"), value: UI.fmtNumber(teachers), iconName: "teacher" })}
        </div>

        <div class="split-2fr-1fr">
          <div class="card">
            <div class="card-head">
              <h3>${i18n.t("dash.recent")}</h3>
              <button class="btn sm ghost" data-go="sales">${i18n.t("nav.sales")} →</button>
            </div>
            <div class="card-body" style="padding:0">
              ${recent.length ? UI.table({
                columns: [
                  { key: "when", label: i18n.t("common.date"),
                    render: r => UI.fmtDate(r.ts || r.session) },
                  { key: "book", label: i18n.t("sales.book"),
                    render: r => `<strong>${UI.escape(r.book || "—")}</strong>` },
                  { key: "qty",   label: i18n.t("sales.qty"),   numeric: true, type: "number" },
                  { key: "total", label: i18n.t("sales.total"), numeric: true,
                    render: r => `<strong>${UI.fmtMoney(r.total)}</strong>` }
                ],
                rows: recent
              }) : UI.empty(i18n.t("sales.empty"))}
            </div>
          </div>

          <div class="card">
            <div class="card-head">
              <h3>${i18n.t("dash.top")}</h3>
              <button class="btn sm ghost" data-go="reports">${i18n.t("nav.reports")} →</button>
            </div>
            <div class="card-body">
              ${top.length ? this.renderTop(top) : UI.empty(i18n.t("sales.empty"))}
            </div>
          </div>
        </div>
      `}
    `;
  },

  stat({ label, value, sub = "", iconName, tone = "" }) {
    return `
      <div class="stat ${tone}">
        <div>
          <div class="lbl">${UI.escape(label)}</div>
          <div class="val">${value}</div>
          ${sub ? `<div class="sub">${UI.escape(sub)}</div>` : ""}
        </div>
        <div class="stat-ic">${icon(iconName)}</div>
      </div>
    `;
  },

  renderTop(items) {
    const max = Math.max(...items.map(i => i.qty), 1);
    return `<div class="rank-list">
      ${items.map((it, i) => `
        <div class="rank-item">
          <span class="rank">${i + 1}</span>
          <div>
            <div class="name" title="${UI.escape(it.book)}">${UI.escape(it.book)}</div>
            <div class="meta">${UI.fmtMoney(it.revenue)}</div>
            <div class="rank-bar"><div style="width:${(it.qty / max * 100).toFixed(1)}%"></div></div>
          </div>
          <span class="val">${UI.fmtNumber(it.qty)}</span>
        </div>
      `).join("")}
    </div>`;
  },

  renderOnboarding() {
    return `
      <div class="card" style="margin-bottom:16px">
        <div class="card-body" style="padding:32px; text-align:center">
          <div style="display:inline-flex;align-items:center;justify-content:center;
                      width:64px;height:64px;border-radius:50%;background:var(--primary-soft);
                      color:var(--primary);margin-bottom:12px">
            ${icon("dashboard", "lg")}
          </div>
          <h2 style="margin:0 0 6px;font-size:20px">${UI.escape(DB.data.settings.orgName || "Welcome")}</h2>
          <p style="color:var(--text-soft);margin:0 0 24px;max-width:480px;margin-inline:auto">
            ${i18n.t("dash.empty")}
          </p>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <button class="btn primary" data-go="teachers">${icon("teacher")} ${i18n.t("teachers.add")}</button>
            <button class="btn" data-go="subjects">${icon("subject")} ${i18n.t("subjects.add")}</button>
            <button class="btn" data-go="students">${icon("user")} ${i18n.t("students.add")}</button>
            <button class="btn" data-go="sales">${icon("sales")} ${i18n.t("nav.sales")}</button>
          </div>
          <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px;padding-top:16px;border-top:1px solid var(--border)">
            <button class="btn ghost" id="loadSampleBtn">${icon("play")} ${i18n.t("settings.sampleBtn")}</button>
            <button class="btn ghost" id="howtoBtn">${icon("info")} ${i18n.t("settings.howtoBtn")}</button>
          </div>
        </div>
      </div>
    `;
  },

  bind() {
    document.querySelectorAll("[data-go]").forEach(b => {
      b.onclick = () => App.go(b.dataset.go);
    });
    document.getElementById("loadSampleBtn")?.addEventListener("click", () => {
      UI.confirm(i18n.t("settings.sampleDesc"), () => {
        DB.loadSample();
        UI.toast(i18n.t("settings.sampleAdded"), "success");
        App.renderPageOnly();
      }, { okLabel: i18n.t("settings.sampleBtn"), danger: false });
    });
    document.getElementById("howtoBtn")?.addEventListener("click", () => Settings.showHowto());
  }
};


// ===== js/modules/sales.js =====
// Daily sales ledger.
// - Sticky quick-add row at top: book -> teacher -> type -> qty -> price -> +
// - Enter key on any field adds the record.
// - Book field autocompletes from history and auto-fills teacher/type/price.
// - "Start new day" closes the current session; data stays in Reports.

const Sales = {
  draft: { book: "", teacherId: "", typeId: "", qty: 1, price: 0 },

  render() {
    const session = DB.currentSession();
    const rows = DB.sessionSales().sort((a, b) => (b.ts || "").localeCompare(a.ts || ""));
    const grand = rows.reduce((sum, r) => sum + (+r.total || 0), 0);
    const units = rows.reduce((sum, r) => sum + (+r.qty || 0), 0);

    const teachers = DB.list("teachers");
    const types    = DB.list("bookTypes");
    const history  = DB.bookHistory();

    return `
      <div class="page-head">
        <div>
          <h1 class="page-title">${i18n.t("sales.title")}</h1>
          <div class="page-sub">${i18n.t("sales.sub")}</div>
        </div>
        <div class="page-actions">
          <button class="btn" id="newDayBtn" title="${i18n.t("sales.newDay")}">
            ${icon("refresh")} ${i18n.t("sales.newDay")}
          </button>
        </div>
      </div>

      <div class="session-bar">
        <div class="session-info">
          <div class="item">
            <div class="lbl">${i18n.t("sales.session")}</div>
            <div class="val">${UI.fmtDate(session.current)}</div>
          </div>
          <div class="item">
            <div class="lbl">${i18n.t("sales.count")}</div>
            <div class="val">${UI.fmtNumber(rows.length)}</div>
          </div>
          <div class="item">
            <div class="lbl">${i18n.t("common.quantity")}</div>
            <div class="val">${UI.fmtNumber(units)}</div>
          </div>
        </div>
        <div class="session-info">
          <div class="item" style="text-align:end">
            <div class="lbl">${i18n.t("sales.grand")}</div>
            <div class="val big">${UI.fmtMoney(grand)}</div>
          </div>
        </div>
      </div>

      <div class="quickbar-wrap">
        <div class="quickbar-title">${icon("plus","sm")} ${i18n.t("sales.add")}</div>
        <form class="quickbar" id="quickForm" autocomplete="off">
          <div class="qb-field qb-book">
            <label for="qBook">${i18n.t("sales.book")} <span style="color:var(--danger)">*</span></label>
            <input id="qBook" list="bookHist"
              placeholder="${i18n.t("sales.hintBook")}"
              value="${UI.escape(this.draft.book)}" />
            <datalist id="bookHist">
              ${history.map(h => `<option value="${UI.escape(h.book)}"></option>`).join("")}
            </datalist>
          </div>

          <div class="qb-field">
            <label for="qTeacher">${i18n.t("sales.teacher")}</label>
            <select id="qTeacher">
              <option value="">—</option>
              ${teachers.map(t =>
                `<option value="${UI.escape(t.id)}" ${this.draft.teacherId === t.id ? "selected" : ""}>${UI.escape(t.name)}</option>`
              ).join("")}
            </select>
          </div>

          <div class="qb-field">
            <label for="qType">${i18n.t("sales.type")}</label>
            <select id="qType">
              <option value="">—</option>
              ${types.map(t =>
                `<option value="${UI.escape(t.id)}" ${this.draft.typeId === t.id ? "selected" : ""}>${UI.escape(t.name)}</option>`
              ).join("")}
            </select>
          </div>

          <div class="qb-field qb-qty">
            <label for="qQty">${i18n.t("sales.qty")}</label>
            <input id="qQty" type="number" min="1" value="${+this.draft.qty || 1}"/>
          </div>

          <div class="qb-field">
            <label for="qPrice">${i18n.t("sales.price")}</label>
            <input id="qPrice" type="number" min="0" step="0.01" value="${+this.draft.price || 0}"/>
          </div>

          <div class="qb-field qb-add">
            <label style="opacity:0">.</label>
            <button type="button" class="btn primary add-btn" id="qAddBtn">
              ${icon("plus")} ${i18n.t("sales.add")}
            </button>
          </div>
        </form>
        <div class="kbd-hint">↵ Enter after typing a book name to add the record quickly.</div>
      </div>

      ${rows.length ? UI.table({
        columns: [
          { key: "time", label: i18n.t("common.time"),
            render: r => `<span class="tag muted">${UI.fmtTime(r.ts)}</span>` },
          { key: "book", label: i18n.t("sales.book"),
            render: r => `<strong>${UI.escape(r.book)}</strong>` },
          { key: "teacher", label: i18n.t("sales.teacher"),
            render: r => UI.escape(UI.lookupName("teachers", r.teacherId)) },
          { key: "type", label: i18n.t("sales.type"),
            render: r => {
              const t = DB.get("bookTypes", r.typeId);
              return t ? `<span class="tag muted">${UI.escape(t.name)}</span>` : "—";
            } },
          { key: "qty",   label: i18n.t("sales.qty"),   numeric: true, type: "number" },
          { key: "price", label: i18n.t("sales.price"), numeric: true, type: "money" },
          { key: "total", label: i18n.t("sales.total"), numeric: true,
            render: r => `<strong>${UI.fmtMoney(r.total)}</strong>` },
          { key: "actions", label: "", className: "num",
            render: r => `<button class="btn sm danger" data-del="${UI.escape(r.id)}" title="${i18n.t("common.delete")}">${icon("trash","sm")}</button>` }
        ],
        rows
      }) : `<div class="card"><div class="card-body">
        ${UI.empty(i18n.t("sales.empty"), `<div style="color:var(--text-mute)">${i18n.t("sales.emptyCta")}</div>`)}
      </div></div>`}
    `;
  },

  bind() {
    const form = document.getElementById("quickForm");
    if (form) {
      // Prevent native submit (belt & suspenders)
      form.addEventListener("submit", e => { e.preventDefault(); this.submit(); });

      // Direct click handler on the Add button — most reliable
      const addBtn = document.getElementById("qAddBtn");
      if (addBtn) addBtn.onclick = () => this.submit();

      // Enter key on any input in the quickbar → submit
      form.querySelectorAll("input, select").forEach(el => {
        el.addEventListener("keydown", e => {
          if (e.key === "Enter") { e.preventDefault(); this.submit(); }
        });
      });

      // Book autocomplete — fills teacher, type, price from history
      const bookIn = document.getElementById("qBook");
      if (bookIn) bookIn.addEventListener("input", e => {
        this.draft.book = e.target.value;
        const match = DB.bookHistory().find(h => h.book.toLowerCase() === e.target.value.trim().toLowerCase());
        if (match) {
          this.draft.teacherId = match.teacherId || "";
          this.draft.typeId    = match.typeId    || "";
          this.draft.price     = match.price     || 0;
          const t  = document.getElementById("qTeacher"); if (t)  t.value  = this.draft.teacherId;
          const ty = document.getElementById("qType");    if (ty) ty.value = this.draft.typeId;
          const p  = document.getElementById("qPrice");   if (p)  p.value  = this.draft.price;
        }
      });
      document.getElementById("qTeacher")?.addEventListener("change", e => this.draft.teacherId = e.target.value);
      document.getElementById("qType")?.addEventListener("change",    e => this.draft.typeId    = e.target.value);
      document.getElementById("qQty")?.addEventListener("input",      e => this.draft.qty      = e.target.value);
      document.getElementById("qPrice")?.addEventListener("input",    e => this.draft.price    = e.target.value);
    }

    // Delete row
    document.querySelectorAll("[data-del]").forEach(b => {
      b.onclick = () => {
        UI.confirm(i18n.t("common.confirmDelete"), () => {
          DB.removeSale(b.dataset.del);
          UI.toast(i18n.t("common.deleted"), "success");
          App.renderPageOnly();
        });
      };
    });

    document.getElementById("newDayBtn")?.addEventListener("click", () => {
      UI.confirm(i18n.t("sales.newDayConfirm"), () => {
        DB.startNewDay();
        this.draft = { book: "", teacherId: "", typeId: "", qty: 1, price: 0 };
        UI.toast(i18n.t("common.saved"), "success");
        App.renderPageOnly();
      }, { danger: false, okLabel: i18n.t("sales.newDay") });
    });
  },

  submit() {
    try {
      const book      = (document.getElementById("qBook")?.value || "").trim();
      const teacherId = document.getElementById("qTeacher")?.value || "";
      const typeId    = document.getElementById("qType")?.value    || "";
      const qty       = document.getElementById("qQty")?.value     || "1";
      const price     = document.getElementById("qPrice")?.value   || "0";

      if (!book) {
        UI.toast(i18n.t("sales.book") + " *", "error");
        document.getElementById("qBook")?.focus();
        return;
      }
      if (!(+qty >= 1)) {
        UI.toast(i18n.t("sales.qty") + " ≥ 1", "error");
        document.getElementById("qQty")?.focus();
        return;
      }

      DB.addSale({ book, teacherId, typeId, qty, price });

      // Keep teacher/type/price (repeat sales). Clear book+qty.
      this.draft = { book: "", teacherId, typeId, qty: 1, price };
      UI.toast(i18n.t("common.saved"), "success");
      App.renderPageOnly();
      setTimeout(() => document.getElementById("qBook")?.focus(), 40);
    } catch (e) {
      UI.toast(e.message || "Error", "error");
    }
  }
};


// ===== js/modules/schedule.js =====
// Weekly Schedule Builder
// - Chip filters: Grade → Class → Shift (with smart defaults)
// - 6-column grid: Sun..Fri (or user's set of days)
// - Click a slot to add; click an entry to edit
// - Save & add another supported

const Schedule = {
  filter: { gradeId: "", classId: "", shiftId: "", day: "" },
  DAYS: [
    { id: "Sun", label: "Sunday" },
    { id: "Mon", label: "Monday" },
    { id: "Tue", label: "Tuesday" },
    { id: "Wed", label: "Wednesday" },
    { id: "Thu", label: "Thursday" },
    { id: "Fri", label: "Friday" }
  ],

  // Set smart defaults on first render:
  // prefer the grade/class that already has schedule entries so the user sees data.
  ensureDefaults() {
    const grades = DB.list("grades");
    const shifts = DB.list("shifts");
    const entries = DB.list("schedule");

    if (!this.filter.gradeId && grades.length) {
      // Grade with most entries wins; fall back to first grade
      const counts = {};
      entries.forEach(e => { counts[e.gradeId] = (counts[e.gradeId] || 0) + 1; });
      const bestGrade = Object.entries(counts).sort((a,b) => b[1]-a[1])[0]?.[0];
      this.filter.gradeId = grades.find(g => g.id === bestGrade)?.id || grades[0].id;
    }
    if (this.filter.gradeId) {
      const classes = DB.classesForGrade(this.filter.gradeId);
      const stillValid = classes.some(c => c.id === this.filter.classId);
      if (!stillValid) {
        const gradeEntries = entries.filter(e => e.gradeId === this.filter.gradeId);
        const cCounts = {};
        gradeEntries.forEach(e => { cCounts[e.classId] = (cCounts[e.classId] || 0) + 1; });
        const bestClass = Object.entries(cCounts).sort((a,b) => b[1]-a[1])[0]?.[0];
        this.filter.classId = classes.find(c => c.id === bestClass)?.id || classes[0]?.id || "";
      }
    }
    if (!this.filter.shiftId && shifts.length) {
      this.filter.shiftId = shifts[0].id;
    }
  },

  render() {
    this.ensureDefaults();
    const grades = DB.list("grades");
    const classes = DB.classesForGrade(this.filter.gradeId);
    const shifts = DB.list("shifts");

    if (!grades.length) {
      return `
        <div class="page-head">
          <div>
            <h1 class="page-title">${i18n.t("sched.title")}</h1>
            <div class="page-sub">${i18n.t("sched.sub")}</div>
          </div>
        </div>
        <div class="card"><div class="card-body">
          ${UI.empty(i18n.t("sched.pickClassFirst"),
            `<button class="btn primary" onclick="App.go('settings')">${icon("settings")} ${i18n.t("nav.settings")}</button>`)}
        </div></div>
      `;
    }

    const entries = DB.scheduleFor({
      gradeId: this.filter.gradeId,
      classId: this.filter.classId,
      shiftId: this.filter.shiftId
    });

    return `
      <div class="page-head">
        <div>
          <h1 class="page-title">${i18n.t("sched.title")}</h1>
          <div class="page-sub">${i18n.t("sched.sub")}</div>
        </div>
        <div class="page-actions">
          <button class="btn" onclick="window.print()">${icon("print")} ${i18n.t("common.print")}</button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">${i18n.t("students.grade")}</span>
          ${Schedule.renderScopedFilter(grades, this.filter.gradeId, "fgrade")}
        </div>

        ${classes.length ? `
          <div class="filter-group">
            <span class="filter-label">${i18n.t("students.class")}</span>
            ${Schedule.renderScopedFilter(classes, this.filter.classId, "fclass")}
          </div>
        ` : ""}

        ${shifts.length ? `
          <div class="filter-group">
            <span class="filter-label">${i18n.t("subjects.shift")}</span>
            ${Schedule.renderScopedFilter(shifts, this.filter.shiftId, "fshift")}
          </div>
        ` : ""}

        <div class="filter-summary">
          ${icon("check")} ${UI.escape(UI.lookupName("grades", this.filter.gradeId))}
          · ${UI.escape(UI.lookupName("classes", this.filter.classId))}
          ${this.filter.shiftId ? ` · ${UI.escape(UI.lookupName("shifts", this.filter.shiftId))}` : ""}
        </div>
      </div>

      ${!this.filter.classId ? `
        <div class="card"><div class="card-body">${UI.empty(i18n.t("sched.pickClass"))}</div></div>
      ` : this.renderGrid(entries)}
    `;
  },

  renderGrid(entries) {
    // Group entries by day
    const byDay = {};
    this.DAYS.forEach(d => byDay[d.id] = []);
    entries.forEach(e => {
      if (!byDay[e.day]) byDay[e.day] = [];
      byDay[e.day].push(e);
    });
    // Sort by start time
    Object.values(byDay).forEach(arr => arr.sort((a,b) => (a.startTime||"").localeCompare(b.startTime||"")));

    return `
      <div class="sched-grid">
        ${this.DAYS.map(d => `
          <div class="sched-col">
            <div class="sched-day-head">${d.label}</div>
            <div class="sched-day-body">
              ${byDay[d.id].map(e => this.renderEntry(e)).join("")}
              <button class="sched-add" data-add-day="${d.id}" title="${i18n.t("sched.add")}">
                ${icon("plus")}
              </button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
  },

  renderEntry(e) {
    const subject = DB.get("subjects", e.subjectId);
    const teacher = DB.get("teachers", e.teacherId);
    return `
      <div class="sched-entry lecture" data-edit="${UI.escape(e.id)}">
        <div class="sched-entry-head">
          <span class="sched-title">${UI.escape(subject?.name || "—")}</span>
          <span class="sched-time">${UI.escape(e.startTime || "")}–${UI.escape(e.endTime || "")}</span>
        </div>
        <div class="sched-entry-meta">
          ${teacher ? `<span>${icon("user","sm")} ${UI.escape(teacher.name)}</span>` : ""}
        </div>
        ${e.room ? `<div class="sched-entry-room">${icon("location","sm")} ${UI.escape(e.room)}</div>` : ""}
      </div>
    `;
  },

  // Scoped filter: chips if ≤5, dropdown otherwise. No "All" — user must pick one.
  renderScopedFilter(items, selectedId, attrName) {
    if (items.length <= 5) {
      return `<div class="chip-row">
        ${items.map(it => `
          <button class="chip ${selectedId === it.id ? "active" : ""}" data-${attrName}="${UI.escape(it.id)}">${UI.escape(it.name)}</button>
        `).join("")}
      </div>`;
    }
    return `<select class="filter-select" data-${attrName}-select>
      ${items.map(it => `
        <option value="${UI.escape(it.id)}" ${selectedId === it.id ? "selected" : ""}>${UI.escape(it.name)}</option>
      `).join("")}
    </select>`;
  },

  bind() {
    const wire = (attr, key, resetClass = false) => {
      document.querySelectorAll(`[data-${attr}]`).forEach(b => {
        if (b.tagName === "BUTTON") b.onclick = () => {
          this.filter[key] = b.dataset[attr.replace(/-([a-z])/g, (_,c) => c.toUpperCase())];
          if (resetClass) this.filter.classId = "";
          App.renderPageOnly();
        };
      });
      const sel = document.querySelector(`[data-${attr}-select]`);
      if (sel) sel.onchange = e => {
        this.filter[key] = e.target.value;
        if (resetClass) this.filter.classId = "";
        App.renderPageOnly();
      };
    };
    wire("fgrade", "gradeId", true);
    wire("fclass", "classId");
    wire("fshift", "shiftId");
    document.querySelectorAll("[data-add-day]").forEach(b => b.onclick = () => {
      this.openForm(null, { day: b.dataset.addDay });
    });
    document.querySelectorAll("[data-edit]").forEach(el => el.onclick = () => this.openForm(el.dataset.edit));
  },

  openForm(id, presets = {}) {
    if (!this.filter.classId) {
      UI.toast(i18n.t("sched.pickClass"), "error");
      return;
    }
    const e = id
      ? { ...DB.get("schedule", id) }
      : {
          gradeId: this.filter.gradeId,
          classId: this.filter.classId,
          shiftId: this.filter.shiftId,
          day: presets.day || "Sun",
          type: "lecture",
          startTime: "08:30",
          endTime: "10:00"
        };

    const isEdit = !!id;
    // Only subjects that target this grade (or have no target grade)
    const subjects = DB.list("subjects").filter(s =>
      !s.gradeId || s.gradeId === e.gradeId
    );
    const gradeName = UI.lookupName("grades", e.gradeId);
    const className = UI.lookupName("classes", e.classId);

    const dayLabel = Schedule.DAYS.find(d => d.id === e.day)?.label || e.day || "—";
    // Encode teacher IDs so we can auto-filter teacher dropdown when subject picked
    const subjectTeacherMap = {};
    subjects.forEach(s => {
      const ids = Array.isArray(s.teacherIds) ? s.teacherIds : (s.teacherId ? [s.teacherId] : []);
      subjectTeacherMap[s.id] = ids;
    });

    UI.modal({
      title: isEdit ? i18n.t("sched.edit") : i18n.t("sched.add"),
      bodyHTML: `
        <div class="form-grid">
          <div class="full" style="padding:10px 12px;background:var(--primary-soft);border-radius:6px;font-size:13px;color:var(--primary);display:flex;gap:6px;align-items:center">
            ${icon("info","sm")} <span><strong>${UI.escape(gradeName)}</strong> · <strong>${UI.escape(className)}</strong> · <strong>${UI.escape(dayLabel)}</strong></span>
          </div>
          <div class="field full">
            <label>${icon("bookOpen","sm")} ${i18n.t("sched.subject")} <span class="req">*</span></label>
            <select data-f="subjectId" id="schSub">
              <option value="">${i18n.t("sched.chooseSubject")}</option>
              ${subjects.map(s =>
                `<option value="${UI.escape(s.id)}" ${e.subjectId === s.id ? "selected" : ""}>${UI.escape(s.name)}</option>`
              ).join("")}
            </select>
            ${subjects.length === 0 ? `<div class="hint" style="color:var(--warning)">No subjects for ${UI.escape(gradeName)} yet. Add one in Subjects.</div>` : ""}
          </div>

          <div class="field full">
            <label>${icon("user","sm")} ${i18n.t("sched.instructor")} <span id="schInstrHint" style="color:var(--text-mute);font-weight:400;font-size:11.5px"></span></label>
            <select data-f="teacherId" id="schTeach" disabled>
              <option value="">${i18n.t("sched.chooseSubject")} first</option>
            </select>
          </div>

          <div class="field">
            <label>${icon("clock","sm")} ${i18n.t("sched.start")}</label>
            <input type="time" data-f="startTime" value="${UI.escape(e.startTime || "08:30")}"/>
          </div>
          <div class="field">
            <label>${icon("clock","sm")} ${i18n.t("sched.end")}</label>
            <input type="time" data-f="endTime" value="${UI.escape(e.endTime || "10:00")}"/>
          </div>

          <div class="field full">
            <label>${icon("location","sm")} ${i18n.t("sched.room")}</label>
            <input data-f="room" value="${UI.escape(e.room || "")}" placeholder="${i18n.t("sched.roomHint")}"/>
          </div>

          <input type="hidden" data-f="day" value="${UI.escape(e.day || "Sun")}"/>
          <input type="hidden" data-f="type" value="lecture"/>
        </div>
      `,
      footerHTML: `
        ${isEdit ? `<button class="btn danger" data-delete>${icon("trash","sm")} ${i18n.t("common.delete")}</button>` : ""}
        <div style="flex:1"></div>
        <button class="btn ghost" data-close>${i18n.t("common.cancel")}</button>
        ${!isEdit ? `<button class="btn" data-save-add>${icon("plus","sm")} ${i18n.t("common.saveAdd")}</button>` : ""}
        <button class="btn primary" data-save>${icon("save")} ${i18n.t("common.save")}</button>
      `,
      onOpen: (m) => {
        const subSel = m.querySelector("#schSub");
        const teachSel = m.querySelector("#schTeach");
        const hint = m.querySelector("#schInstrHint");

        // Populate teacher dropdown from subject's teachers only
        const refreshTeachers = () => {
          const sid = subSel.value;
          const teacherIds = subjectTeacherMap[sid] || [];
          if (!sid) {
            teachSel.innerHTML = `<option value="">${i18n.t("sched.chooseSubject")} first</option>`;
            teachSel.disabled = true;
            hint.textContent = "";
            return;
          }
          if (!teacherIds.length) {
            teachSel.innerHTML = `<option value="">— no teachers assigned to this subject —</option>`;
            teachSel.disabled = true;
            hint.textContent = "";
            return;
          }
          teachSel.disabled = false;
          teachSel.innerHTML = teacherIds.map(tid => {
            const t = DB.get("teachers", tid);
            if (!t) return "";
            const selected = (e.teacherId === tid) || (teacherIds.length === 1);
            return `<option value="${UI.escape(tid)}" ${selected ? "selected" : ""}>${UI.escape(t.name)}</option>`;
          }).join("");
          hint.textContent = `— ${teacherIds.length} available`;
        };

        subSel.addEventListener("change", refreshTeachers);
        refreshTeachers();

        m.querySelector("[data-close]").onclick = UI.closeModal;

        m.querySelector("[data-delete]")?.addEventListener("click", () => {
          UI.confirm(i18n.t("common.confirmDelete"), () => {
            DB.remove("schedule", id);
            UI.closeModal();
            UI.toast(i18n.t("common.deleted"), "success");
            App.renderPageOnly();
          });
        });

        const collect = () => {
          const data = { ...e };
          m.querySelectorAll("[data-f]").forEach(el => data[el.dataset.f] = el.value);
          return data;
        };

        const doSave = (thenReopen) => {
          const data = collect();
          if (!data.subjectId && data.type !== "break") {
            UI.toast(i18n.t("sched.subject") + " *", "error");
            return null;
          }
          if (data.startTime && data.endTime && data.startTime >= data.endTime) {
            UI.toast(i18n.t("sched.start") + " < " + i18n.t("sched.end"), "error");
            return null;
          }
          DB.upsert("schedule", data);
          UI.toast(i18n.t("common.saved"), "success");
          if (thenReopen) {
            // Rebuild the form for a new entry on the same day
            const day = data.day;
            UI.closeModal();
            App.renderPageOnly();
            Schedule.openForm(null, { day });
          } else {
            UI.closeModal();
            App.renderPageOnly();
          }
          return data;
        };

        m.querySelector("[data-save]").onclick = () => doSave(false);
        m.querySelector("[data-save-add]")?.addEventListener("click", () => doSave(true));
      }
    });
  }
};


// ===== js/modules/students.js =====
const Students = {
  filter: { q: "", subjectId: "", gradeId: "", classId: "" },

  render() {
    const grades = DB.list("grades");
    const classes = DB.classesForGrade(this.filter.gradeId);

    const q = this.filter.q.toLowerCase();
    const rows = DB.list("students").filter(s => {
      if (q && !(s.fullName || "").toLowerCase().includes(q)
           && !(s.phone || "").includes(this.filter.q)) return false;
      if (this.filter.subjectId && !(s.subjectIds || []).includes(this.filter.subjectId)) return false;
      if (this.filter.gradeId && s.gradeId !== this.filter.gradeId) return false;
      if (this.filter.classId && s.classId !== this.filter.classId) return false;
      return true;
    });

    const totalStudents = DB.list("students").length;
    const activeFilters = [
      this.filter.gradeId && UI.lookupName("grades", this.filter.gradeId),
      this.filter.classId && UI.lookupName("classes", this.filter.classId),
      this.filter.subjectId && UI.lookupName("subjects", this.filter.subjectId)
    ].filter(Boolean);

    return `
      <div class="page-head">
        <div>
          <h1 class="page-title">${i18n.t("students.title")}</h1>
          <div class="page-sub">
            ${UI.fmtNumber(rows.length)} of ${UI.fmtNumber(totalStudents)}
            ${activeFilters.length ? ` · ${activeFilters.map(f => UI.escape(f)).join(" · ")}` : ""}
          </div>
        </div>
        <div class="page-actions">
          <button class="btn primary" id="addBtn">${icon("plus")} ${i18n.t("students.add")}</button>
        </div>
      </div>

      ${totalStudents ? `
        ${grades.length ? `
          <div class="filter-bar">
            <div class="filter-group">
              <span class="filter-label">${i18n.t("students.grade")}</span>
              ${UI.smartFilter({ items: grades, selectedId: this.filter.gradeId, attrName: "fgrade", allLabel: i18n.t("common.all") })}
            </div>
            ${this.filter.gradeId && classes.length ? `
              <div class="filter-group">
                <span class="filter-label">${i18n.t("students.class")}</span>
                ${UI.smartFilter({ items: classes, selectedId: this.filter.classId, attrName: "fclass", allLabel: i18n.t("common.all") })}
              </div>
            ` : ""}
            ${(() => {
              const relevantSubs = DB.list("subjects").filter(s =>
                !this.filter.gradeId || !s.gradeId || s.gradeId === this.filter.gradeId
              );
              if (!relevantSubs.length) return "";
              return `
                <div class="filter-group">
                  <span class="filter-label">${i18n.t("nav.subjects")}</span>
                  ${UI.smartFilter({ items: relevantSubs, selectedId: this.filter.subjectId, attrName: "fsubject", allLabel: i18n.t("common.all") })}
                </div>
              `;
            })()}
            ${(this.filter.gradeId || this.filter.classId || this.filter.subjectId) ? `
              <button class="btn sm ghost" id="resetFilters">${icon("x","sm")} ${i18n.t("common.reset")}</button>
            ` : ""}
          </div>
        ` : ""}
        <div class="toolbar">
          <input class="search" id="q" placeholder="${i18n.t("common.search")}" value="${UI.escape(this.filter.q)}"/>
        </div>
      ` : ""}

      ${rows.length ? UI.table({
        columns: [
          { key: "fullName", label: i18n.t("students.fullName"),
            render: r => `<strong>${UI.escape(r.fullName)}</strong>` },
          { key: "phone", label: i18n.t("students.phone"),
            render: r => UI.escape(r.phone || "—") },
          { key: "grade", label: i18n.t("students.grade"),
            render: r => {
              const g = DB.get("grades", r.gradeId);
              return g ? `<span class="tag muted">${UI.escape(g.name)}</span>` : "—";
            } },
          { key: "class", label: i18n.t("students.class"),
            render: r => {
              const c = DB.get("classes", r.classId);
              return c ? `<span class="tag muted">${UI.escape(c.name)}</span>` : "—";
            } },
          { key: "subjects", label: i18n.t("students.subjects"),
            render: r => {
              const ids = r.subjectIds || [];
              if (!ids.length) return `<span class="tag muted">${i18n.t("common.none")}</span>`;
              return ids.map(id => {
                const s = DB.get("subjects", id);
                return s ? `<span class="tag">${UI.escape(s.name)}</span>` : "";
              }).join(" ");
            } },
          { key: "actions", label: "", className: "num",
            render: r => UI.rowActions(r.id) }
        ],
        rows
      }) : `<div class="card"><div class="card-body">
        ${UI.empty(i18n.t("students.none"),
          `<div style="margin-top:8px;color:var(--text-mute)">${i18n.t("students.emptyCta")}</div>
           <button class="btn primary" id="emptyAdd" style="margin-top:14px">${icon("plus")} ${i18n.t("students.add")}</button>`)}
      </div></div>`}
    `;
  },

  bind() {
    document.getElementById("q")?.addEventListener("input", e => { this.filter.q = e.target.value; App.renderPageOnly(); });

    // Chip OR dropdown handlers (smartFilter uses whichever fits)
    const wireFilter = (attr, key, resetClass = false) => {
      document.querySelectorAll(`[data-${attr}]`).forEach(b => {
        // Chip button
        if (b.tagName === "BUTTON") {
          b.onclick = () => {
            this.filter[key] = b.dataset[toCamel(attr)];
            if (resetClass) this.filter.classId = "";
            App.renderPageOnly();
          };
        }
      });
      const sel = document.querySelector(`[data-${attr}-select]`);
      if (sel) sel.onchange = e => {
        this.filter[key] = e.target.value;
        if (resetClass) this.filter.classId = "";
        App.renderPageOnly();
      };
    };
    const toCamel = s => s.replace(/-([a-z])/g, (_, c) => c.toUpperCase());

    wireFilter("fgrade",   "gradeId", true);
    wireFilter("fclass",   "classId");
    wireFilter("fsubject", "subjectId");

    document.getElementById("resetFilters")?.addEventListener("click", () => {
      this.filter = { q: this.filter.q, subjectId: "", gradeId: "", classId: "" };
      App.renderPageOnly();
    });
    document.getElementById("addBtn")?.addEventListener("click", () => this.openForm());
    document.getElementById("emptyAdd")?.addEventListener("click", () => this.openForm());
    UI.bindRowActions("students", id => this.openForm(id));
  },

  openForm(id) {
    const s = id ? { ...DB.get("students", id) } : { subjectIds: [], enrolled: DB.today() };
    s.custom = Array.isArray(s.custom) ? [...s.custom] : [];
    const selectedSubs = new Set(s.subjectIds || []);
    const allSubs = DB.list("subjects");

    UI.modal({
      title: id ? i18n.t("common.edit") + " — " + i18n.t("students.title") : i18n.t("students.add"),
      wide: true,
      bodyHTML: `
        <div class="form-grid">
          <div class="field full">
            <label>${i18n.t("students.fullName")} <span class="req">*</span></label>
            <input data-f="fullName" value="${UI.escape(s.fullName || "")}" required/>
          </div>
          <div class="field">
            <label>${i18n.t("students.phone")}</label>
            <input data-f="phone" value="${UI.escape(s.phone || "")}"/>
          </div>
          <div class="field">
            <label>${i18n.t("students.gender")}</label>
            <select data-f="gender">
              <option value="">—</option>
              <option value="male"   ${s.gender === "male"   ? "selected" : ""}>${i18n.t("students.male")}</option>
              <option value="female" ${s.gender === "female" ? "selected" : ""}>${i18n.t("students.female")}</option>
            </select>
          </div>
          <div class="field">
            <label>${i18n.t("students.dob")}</label>
            <input type="date" data-f="dob" value="${UI.escape(s.dob || "")}"/>
          </div>
          <div class="field">
            <label>${i18n.t("students.enrolled")}</label>
            <input type="date" data-f="enrolled" value="${UI.escape(s.enrolled || DB.today())}"/>
          </div>
          <div class="field">
            <label>${i18n.t("students.guardian")}</label>
            <input data-f="guardian" value="${UI.escape(s.guardian || "")}"/>
          </div>

          <div class="field">
            <label>${i18n.t("students.grade")}</label>
            <select data-f="gradeId" id="stuGradeSel">
              <option value="">—</option>
              ${DB.list("grades").map(g =>
                `<option value="${UI.escape(g.id)}" ${s.gradeId === g.id ? "selected" : ""}>${UI.escape(g.name)}</option>`
              ).join("")}
            </select>
          </div>
          <div class="field">
            <label>${i18n.t("students.class")}</label>
            <select data-f="classId" id="stuClassSel">
              <option value="">${s.gradeId ? "—" : i18n.t("students.pickClassHint")}</option>
              ${DB.classesForGrade(s.gradeId).map(c =>
                `<option value="${UI.escape(c.id)}" ${s.classId === c.id ? "selected" : ""}>${UI.escape(c.name)}</option>`
              ).join("")}
            </select>
          </div>

          <div class="field full">
            <label>${i18n.t("students.address")}</label>
            <input data-f="address" value="${UI.escape(s.address || "")}"/>
          </div>
          <div class="field full">
            <label>${i18n.t("students.subjects")} <span id="subHint" style="color:var(--text-mute);font-weight:400;font-size:11.5px"></span></label>
            ${allSubs.length
              ? `<div class="checklist" id="subCl"></div>`
              : `<div class="hint">${i18n.t("subjects.none")} — ${i18n.t("subjects.emptyCta")}</div>`}
          </div>
          <div class="field full">
            <label>${i18n.t("students.custom")}</label>
            <div class="custom-fields" id="customFields"></div>
            <button type="button" class="btn sm" id="addCustom" style="margin-top:8px;align-self:flex-start">
              ${icon("plus","sm")} ${i18n.t("students.addField")}
            </button>
          </div>
          <div class="field full">
            <label>${i18n.t("common.notes")}</label>
            <textarea data-f="notes">${UI.escape(s.notes || "")}</textarea>
          </div>
        </div>
      `,
      footerHTML: `
        <button class="btn ghost" data-close>${i18n.t("common.cancel")}</button>
        ${id ? "" : `<button class="btn" data-save-add>${icon("plus","sm")} ${i18n.t("common.saveAdd")}</button>`}
        <button class="btn primary" data-save>${icon("save")} ${i18n.t("common.save")}</button>
      `,
      onOpen(m) {
        // Grade → Class cascade + Grade → Subjects cascade
        const gradeSel = m.querySelector("#stuGradeSel");
        const classSel = m.querySelector("#stuClassSel");
        const subCl    = m.querySelector("#subCl");
        const subHint  = m.querySelector("#subHint");

        // Track selections across grade switches
        const chosen = new Set(selectedSubs);

        const renderSubList = () => {
          if (!subCl) return;
          const gid = gradeSel ? gradeSel.value : s.gradeId;
          // "All grades" subjects (no gradeId) always show; grade-specific match current grade
          const relevant = allSubs.filter(sub => !sub.gradeId || !gid || sub.gradeId === gid);
          if (!relevant.length) {
            subCl.innerHTML = `<div style="padding:12px;color:var(--text-mute);font-size:13px">
              ${gid ? "No subjects match this grade yet." : i18n.t("subjects.none")}
            </div>`;
            if (subHint) subHint.textContent = "";
            return;
          }
          subCl.innerHTML = relevant.map(sub => `
            <label>
              <input type="checkbox" value="${UI.escape(sub.id)}" ${chosen.has(sub.id) ? "checked" : ""}/>
              <span>${UI.escape(sub.name)}</span>
              <span class="meta">${UI.escape(UI.lookupName("teachers", sub.teacherId))}</span>
            </label>
          `).join("");
          subCl.querySelectorAll("input[type='checkbox']").forEach(cb => {
            cb.onchange = () => {
              if (cb.checked) chosen.add(cb.value); else chosen.delete(cb.value);
            };
          });
          if (subHint) subHint.textContent = gid
            ? `— ${relevant.length} for this grade`
            : `— ${allSubs.length} total`;
        };

        if (gradeSel && classSel) {
          gradeSel.addEventListener("change", () => {
            const gid = gradeSel.value;
            const opts = DB.classesForGrade(gid);
            classSel.innerHTML =
              `<option value="">${gid ? "—" : i18n.t("students.pickClassHint")}</option>` +
              opts.map(c =>
                `<option value="${UI.escape(c.id)}">${UI.escape(c.name)}</option>`
              ).join("");
            renderSubList();
          });
        }
        renderSubList();

        // Custom fields renderer
        const cfWrap = m.querySelector("#customFields");
        const renderCF = () => {
          if (!s.custom.length) {
            cfWrap.innerHTML = `<div class="empty-line">${i18n.t("common.none")}</div>`;
            return;
          }
          cfWrap.innerHTML = s.custom.map((f, i) => `
            <div class="row">
              <input placeholder="${i18n.t("students.fieldLabel")}" value="${UI.escape(f.label)}" data-cf-lbl="${i}"/>
              <input placeholder="${i18n.t("students.fieldValue")}" value="${UI.escape(f.value)}" data-cf-val="${i}"/>
              <button type="button" class="btn sm ghost" data-cf-del="${i}" title="${i18n.t("common.remove")}">${icon("close","sm")}</button>
            </div>
          `).join("");
          cfWrap.querySelectorAll("[data-cf-lbl]").forEach(inp => {
            inp.oninput = e => { s.custom[+e.target.dataset.cfLbl].label = e.target.value; };
          });
          cfWrap.querySelectorAll("[data-cf-val]").forEach(inp => {
            inp.oninput = e => { s.custom[+e.target.dataset.cfVal].value = e.target.value; };
          });
          cfWrap.querySelectorAll("[data-cf-del]").forEach(btn => {
            btn.onclick = () => { s.custom.splice(+btn.dataset.cfDel, 1); renderCF(); };
          });
        };
        renderCF();
        m.querySelector("#addCustom").onclick = () => {
          s.custom.push({ label: "", value: "" });
          renderCF();
        };

        m.querySelector("[data-close]").onclick = UI.closeModal;

        const doSave = (thenAnother) => {
          const data = { ...s };
          m.querySelectorAll("[data-f]").forEach(el => {
            data[el.dataset.f] = el.value.trim ? el.value.trim() : el.value;
          });
          data.custom = s.custom.filter(f => f.label.trim() || f.value.trim());
          if (!data.fullName) return UI.toast(i18n.t("students.fullName") + " *", "error");
          const saved = DB.upsert("students", data);
          DB.setStudentSubjects(saved.id, [...chosen]);
          UI.toast(i18n.t("common.saved"), "success");
          if (thenAnother) {
            // Remember grade/class so multiple entries in the same class are fast
            const rememberedGrade = data.gradeId;
            const rememberedClass = data.classId;
            UI.closeModal();
            App.renderPageOnly();
            Students.openForm();
            // After reopen, pre-fill grade+class
            setTimeout(() => {
              const gs = document.getElementById("stuGradeSel");
              const cs = document.getElementById("stuClassSel");
              if (gs && rememberedGrade) {
                gs.value = rememberedGrade;
                gs.dispatchEvent(new Event("change", { bubbles: true }));
                if (cs && rememberedClass) cs.value = rememberedClass;
              }
            }, 80);
          } else {
            UI.closeModal();
            App.renderPageOnly();
          }
        };

        m.querySelector("[data-save]").onclick = () => doSave(false);
        m.querySelector("[data-save-add]")?.addEventListener("click", () => doSave(true));
      }
    });
  }
};


// ===== js/modules/subjects.js =====
const Subjects = {
  filter: { q: "", gradeId: "" },

  render() {
    const q = this.filter.q.toLowerCase();
    const rows = DB.list("subjects").filter(s => {

        // "All grades" (gradeId="") subjects always match; specific ones must match
        if (s.gradeId && s.gradeId !== this.filter.gradeId) return false;
      }
      return true;
    });

    return `
      <div class="page-head">
        <div>
          <h1 class="page-title">${i18n.t("subjects.title")}</h1>
          <div class="page-sub">${i18n.t("subjects.sub")} • ${UI.fmtNumber(rows.length)}</div>
        </div>
        <div class="page-actions">
          <button class="btn primary" id="addBtn">${icon("plus")} ${i18n.t("subjects.add")}</button>
        </div>
      </div>

      ${DB.list("subjects").length ? `
        ${DB.list("grades").length ? `
          <div class="filter-bar">
            <div class="filter-group">
              <span class="filter-label">${i18n.t("students.grade")}</span>
              ${UI.smartFilter({ items: DB.list("grades"), selectedId: this.filter.gradeId, attrName: "fgrade", allLabel: i18n.t("common.all") })}
            </div>
          </div>
        ` : ""}
        <div class="toolbar">
          <input class="search" id="q" placeholder="${i18n.t("common.search")}" value="${UI.escape(this.filter.q)}"/>
        </div>
      ` : ""}

      ${rows.length ? UI.table({
        columns: [
          { key: "name", label: i18n.t("subjects.name"),
            render: r => `<strong>${UI.escape(r.name)}</strong>` },
          { key: "grade", label: i18n.t("subjects.grade"),
            render: r => {
              const g = DB.get("grades", r.gradeId);
              return g ? `<span class="tag muted">${UI.escape(g.name)}</span>`
                       : `<span class="tag muted">${i18n.t("subjects.gradeAll")}</span>`;
            } },
          { key: "teachers", label: i18n.t("subjects.teacher"),
            render: r => {
              const ids = r.teacherIds || (r.teacherId ? [r.teacherId] : []);
              if (!ids.length) return "—";
              return ids.map(id => {
                const t = DB.get("teachers", id);
                return t ? `<span class="tag">${UI.escape(t.name)}</span>` : "";
              }).join(" ");
            } },
          { key: "shift", label: i18n.t("subjects.shift"),
            render: r => {
              const s = DB.get("shifts", r.shiftId);
              return s ? `<span class="tag muted">${UI.escape(s.name)}</span>` : "—";
            } },
          { key: "price", label: i18n.t("subjects.price"), numeric: true, type: "money" },
          { key: "students", label: i18n.t("subjects.students"), numeric: true,
            render: r => `<span class="tag">${UI.fmtNumber((r.studentIds || []).length)}</span>` },
          { key: "actions", label: "", className: "num",
            render: r => `
              <button class="btn sm" data-manage="${UI.escape(r.id)}" title="${i18n.t("subjects.manage")}">${icon("users","sm")}</button>
              ${UI.rowActions(r.id)}
            ` }
        ],
        rows
      }) : `<div class="card"><div class="card-body">
        ${UI.empty(i18n.t("subjects.none"),
          `<div style="margin-top:8px;color:var(--text-mute)">${i18n.t("subjects.emptyCta")}</div>
           <button class="btn primary" id="emptyAdd" style="margin-top:14px">${icon("plus")} ${i18n.t("subjects.add")}</button>`)}
      </div></div>`}
    `;
  },

  bind() {
    document.getElementById("q")?.addEventListener("input", e => { this.filter.q = e.target.value; App.renderPageOnly(); });
    document.querySelectorAll("[data-fgrade]").forEach(b => {
      if (b.tagName === "BUTTON") b.onclick = () => {
        this.filter.gradeId = b.dataset.fgrade;
        App.renderPageOnly();
      };
    });
    document.querySelector("[data-fgrade-select]")?.addEventListener("change", e => {
      this.filter.gradeId = e.target.value;
      App.renderPageOnly();
    });
    document.getElementById("addBtn")?.addEventListener("click", () => this.openForm());
    document.getElementById("emptyAdd")?.addEventListener("click", () => this.openForm());
    document.querySelectorAll("[data-manage]").forEach(b => {
      b.onclick = () => this.manageStudents(b.dataset.manage);
    });
    UI.bindRowActions("subjects", id => this.openForm(id));
  },

  openForm(id) {
    const s = id ? { ...DB.get("subjects", id) } : { studentIds: [], teacherIds: [] };
    s.teacherIds = Array.isArray(s.teacherIds) ? [...s.teacherIds] : (s.teacherId ? [s.teacherId] : []);
    const chosenTeachers = new Set(s.teacherIds);
    const allTeachers = DB.list("teachers");

    UI.modal({
      title: id ? i18n.t("common.edit") + " — " + i18n.t("subjects.title") : i18n.t("subjects.add"),
      bodyHTML: `
        <div class="form-grid">
          <div class="field full">
            <label>${i18n.t("subjects.name")} <span class="req">*</span></label>
            <input data-f="name" value="${UI.escape(s.name || "")}"/>
          </div>
          <div class="field">
            <label>${i18n.t("subjects.grade")}</label>
            <select data-f="gradeId">
              <option value="">${i18n.t("subjects.gradeAll")}</option>
              ${DB.list("grades").map(g =>
                `<option value="${UI.escape(g.id)}" ${s.gradeId === g.id ? "selected" : ""}>${UI.escape(g.name)}</option>`
              ).join("")}
            </select>
          </div>
          <div class="field">
            <label>${i18n.t("subjects.shift")}</label>
            <select data-f="shiftId">${UI.options("shifts", s.shiftId, { placeholder: "—" })}</select>
          </div>
          <div class="field">
            <label>${i18n.t("subjects.price")}</label>
            <input type="number" min="0" step="0.01" data-f="price" value="${+s.price || 0}"/>
          </div>
          <div class="field"></div>
          <div class="field full">
            <label>${i18n.t("subjects.teacher")} <span style="color:var(--text-mute);font-weight:400;font-size:11.5px">— pick one or more</span></label>
            ${allTeachers.length ? `
              <div class="checklist" id="teachCl">
                ${allTeachers.map(t => `
                  <label>
                    <input type="checkbox" value="${UI.escape(t.id)}" ${chosenTeachers.has(t.id) ? "checked" : ""}/>
                    <span>${UI.escape(t.name)}</span>
                    <span class="meta">${UI.escape(t.phone || "")}</span>
                  </label>
                `).join("")}
              </div>
            ` : `<div class="hint">${i18n.t("teachers.none")} — ${i18n.t("teachers.emptyCta")}</div>`}
          </div>
          <div class="field full">
            <label>${i18n.t("common.notes")}</label>
            <textarea data-f="notes">${UI.escape(s.notes || "")}</textarea>
          </div>
        </div>
